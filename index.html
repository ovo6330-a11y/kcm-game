<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>10인 파티 허브 v3.1 — 난이도 필터링 수정</title>
<style>
  :root {
    --bg: #060b14;
    --panel: #10192b;
    --panel-2: #17233b;
    --border: #273959;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --accent: #f59e0b;
    --success: #10b981;
    --danger: #ef4444;
    --purple: #8b5cf6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: radial-gradient(circle at 50% 0%, #172847 0%, var(--bg) 65%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(7, 12, 22, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand { font-size: 1.1rem; font-weight: 900; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .room-pill-badge {
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(52, 211, 153, 0.45);
    color: #6ee7b7;
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 800;
  }
  .room-pill-badge.locked {
    background: rgba(239, 68, 68, 0.18);
    border-color: rgba(248, 113, 113, 0.5);
    color: #fca5a5;
  }
  .controls-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  select, input, button {
    font-family: inherit;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 11px;
    font-size: 0.84rem;
  }
  button { cursor: pointer; font-weight: 700; transition: transform 0.12s, filter 0.15s; }
  button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.42; cursor: not-allowed; }
  button.primary { background: linear-gradient(135deg, #2563eb, #3b82f6); border-color: #60a5fa; }
  button.success { background: linear-gradient(135deg, #059669, #10b981); border-color: #34d399; color: #022c22; }
  button.warn { background: linear-gradient(135deg, #d97706, #f59e0b); border-color: #fbbf24; color: #1e1b04; }
  button.danger { background: linear-gradient(135deg, #dc2626, #ef4444); border-color: #f87171; }
  button.purple { background: linear-gradient(135deg, #7c3aed, #8b5cf6); border-color: #a78bfa; color: #fff; }
  button.kick-btn { padding: 3px 8px; font-size: 0.72rem; background: rgba(239, 68, 68, 0.22); border-color: rgba(248, 113, 113, 0.5); color: #fca5a5; }

  .invite-banner { max-width: 1640px; width: 100%; margin: 12px auto 0; padding: 0 14px; }
  .invite-bar-inner {
    background: linear-gradient(90deg, rgba(30, 58, 138, 0.42), rgba(88, 28, 135, 0.34));
    border: 1px solid rgba(96, 165, 250, 0.38);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .invite-group { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .code-box {
    background: #050a12;
    border: 1px solid #38bdf8;
    color: #7dd3fc;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .main-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 290px 1fr 310px;
    gap: 14px;
    padding: 14px;
    max-width: 1640px;
    width: 100%;
    margin: 0 auto;
  }
  @media (max-width: 1200px) { .main-grid { grid-template-columns: 1fr; } }

  .card {
    background: rgba(16, 25, 43, 0.94);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
  }
  .card-title {
    font-size: 0.94rem;
    font-weight: 800;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .player-list { display: flex; flex-direction: column; gap: 6px; max-height: 310px; overflow-y: auto; }
  .player-item {
    background: var(--panel-2);
    padding: 8px 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 0.84rem;
  }
  .player-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .player-name-row { display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-actions { display: flex; align-items: center; gap: 5px; }
  .room-tag {
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.16);
    color: #7dd3fc;
    border: 1px solid rgba(56, 189, 248, 0.35);
  }
  .room-tag.host { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); }
  .room-tag.friend { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.45); }
  .room-tag.spectate { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.3); }
  .score-pill { background: #080f1c; padding: 3px 9px; border-radius: 999px; font-weight: 800; color: var(--accent); font-size: 0.79rem; }
  .hof-box { background: #080f1c; border: 1px solid var(--border); border-radius: 11px; padding: 10px; font-size: 0.8rem; line-height: 1.7; }
  .hof-box b { color: #fbbf24; }

  .stage-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #080f1c;
    padding: 10px 14px;
    border-radius: 11px;
    border: 1px solid rgba(148, 163, 184, 0.15);
  }
  .room-switcher {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel-2);
    padding: 8px 12px;
    border-radius: 11px;
    border: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .room-pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .room-btn { padding: 5px 10px; font-size: 0.78rem; border-radius: 8px; background: #0d1627; border: 1px solid var(--border); color: var(--muted); }
  .room-btn.active { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border-color: #93c5fd; }
  .timer-box { font-size: 0.98rem; font-weight: 800; color: #38bdf8; }

  .stage-body {
    flex: 1;
    min-height: 540px;
    background: #070c17;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 윷놀이 UI */
  .yut-layout { display: grid; grid-template-columns: 336px 1fr; gap: 20px; width: 100%; max-width: 860px; align-items: center; }
  @media (max-width: 820px) { .yut-layout { grid-template-columns: 1fr; } }
  .yut-board-wrap {
    width: 336px; height: 336px; margin: 0 auto;
    background: linear-gradient(145deg, #3b2314, #231309);
    border: 4px solid #b47b38; border-radius: 22px; padding: 14px;
    position: relative; box-shadow: inset 0 0 24px rgba(0,0,0,0.65), 0 14px 28px rgba(0,0,0,0.45);
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 6px;
  }
  .yut-node {
    background: #fdf3dc; color: #261608; border-radius: 50%; border: 2px solid #8c5823;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 900; position: relative; z-index: 2;
  }
  .yut-node.corner { background: #fef08a; border: 2.5px solid #d97706; }
  .yut-node.center { background: radial-gradient(circle, #fde047, #f59e0b); border: 3px solid #92400e; transform: scale(1.12); }
  .yut-node.has-piece { box-shadow: 0 0 0 3px #38bdf8, 0 0 14px rgba(56, 189, 248, 0.85); background: #dbeafe; }
  .yut-piece-badge {
    position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff;
    border: 1.5px solid #fff; border-radius: 999px; padding: 1px 5px; font-size: 0.62rem; font-weight: 900;
  }
  .yut-panel { display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .yut-sticks-row { display: flex; gap: 12px; justify-content: center; padding: 14px; background: #080f1c; border-radius: 12px; border: 1px solid var(--border); }
  .yut-stick-3d {
    width: 34px; height: 118px; border-radius: 16px;
    background: linear-gradient(90deg, #e7c68c, #fff3d6 45%, #c79c5b);
    border: 2px solid #855320; display: flex; flex-direction: column; align-items: center; justify-content: space-around;
    color: #4a2c0f; font-weight: 900; font-size: 0.78rem;
  }
  .yut-stick-3d.back { background: linear-gradient(90deg, #b45309, #f59e0b 50%, #92400e); border-color: #fde68a; color: #fff; }
  .piece-selector { display: flex; gap: 8px; flex-wrap: wrap; }
  .piece-chip { padding: 6px 12px; border-radius: 10px; background: #091120; border: 1px solid var(--border); font-size: 0.8rem; font-weight: 800; }
  .piece-chip.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); color: #bae6fd; }

  /* 루미큐브 UI */
  .rk-wrap { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 14px; }
  .rk-table-board {
    min-height: 150px; background: radial-gradient(circle at top, #0f2922, #091814);
    border: 2px solid #1e4d3e; border-radius: 16px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px;
  }
  .rk-meld-group {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(110, 231, 183, 0.28);
    border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .rk-rack { background: linear-gradient(180deg, #2d1d12, #1b1009); border: 2px solid #6b4423; border-radius: 16px; padding: 14px; }
  .rk-tile-3d {
    width: 44px; height: 60px; border-radius: 8px;
    background: linear-gradient(180deg, #fffef7, #f3ebd2);
    border: 1px solid #d6c7a1; border-bottom: 5px solid #b8a374;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 1.15rem; cursor: pointer; position: relative; transition: transform 0.14s;
  }
  .rk-tile-3d::after { content: attr(data-dot); position: absolute; bottom: 3px; font-size: 0.56rem; opacity: 0.75; }
  .rk-tile-3d.selected { transform: translateY(-10px); box-shadow: 0 0 0 3px #38bdf8; }
  .c-red { color: #dc2626; } .c-blue { color: #1d4ed8; } .c-black { color: #111827; } .c-orange { color: #ea580c; }

  /* 고스톱 UI */
  .gs-wrap { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 12px; }
  .gs-felt { background: radial-gradient(circle at center, #14532d, #052e16); border: 3px solid #22c55e; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .gs-zone-label { font-size: 0.78rem; font-weight: 800; color: #bbf7d0; display: flex; justify-content: space-between; align-items: center; }
  .hwatu-3d {
    width: 68px; height: 98px; border-radius: 9px;
    background: linear-gradient(160deg, #fffdf9, #f5efe2);
    border: 2px solid #cbd5e1; border-bottom: 5px solid #64748b;
    color: #0f172a; padding: 5px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    cursor: pointer; transition: transform 0.14s;
  }
  .hwatu-3d:hover { transform: translateY(-7px); }
  .hwatu-3d.gwang { background: linear-gradient(160deg, #fef9c3, #fde047); border-color: #eab308; border-bottom-color: #a16207; }
  .hwatu-3d.tti { background: linear-gradient(160deg, #ffe4e6, #fecdd3); border-color: #f43f5e; border-bottom-color: #be123c; }
  .hwatu-month { font-size: 0.7rem; font-weight: 900; align-self: flex-start; background: rgba(15,23,42,0.1); padding: 1px 5px; border-radius: 5px; }
  .hwatu-art { font-size: 1.55rem; line-height: 1; }
  .hwatu-name { font-size: 0.7rem; font-weight: 900; text-align: center; }

  /* 퀴즈 UI */
  .quiz-box { text-align: center; max-width: 740px; width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .quiz-badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .quiz-tag { background: #1d4ed8; color: #dbeafe; padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
  .diff-tag { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; }
  .diff-easy { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.45); }
  .diff-normal { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.45); }
  .diff-hard { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.45); }
  .quiz-main { font-size: 2rem; font-weight: 800; line-height: 1.35; background: var(--panel); padding: 20px 24px; border-radius: 14px; border: 1px solid var(--border); width: 100%; }
  .quiz-sub { font-size: 0.95rem; color: #cbd5e1; }

  .chat-log { flex: 1; min-height: 380px; max-height: 540px; overflow-y: auto; background: #070c17; border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.84rem; }
  .chat-msg { line-height: 1.4; word-break: break-word; }
  .chat-msg.sys { color: #38bdf8; font-weight: 600; }
  .chat-msg.win { color: #34d399; font-weight: 700; }
  .chat-msg.danger { color: #f87171; font-weight: 700; }
  .chat-input-row { display: flex; gap: 6px; }
  .chat-input-row input { flex: 1; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.82); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal-card { background: var(--panel); border: 2px solid #38bdf8; border-radius: 18px; max-width: 480px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .field-row { display: flex; flex-direction: column; gap: 5px; font-size: 0.84rem; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span>🎮 10인 파티 허브 v3.1</span>
    <span id="roomHeaderBadge" class="room-pill-badge">방: #PARTY1 · 🔓 열림</span>
  </div>
  <div class="controls-bar">
    <button id="btnOpenCreateRoom" class="success">🏠 방 만들기</button>
    <button id="btnToggleLock" class="warn">🔒 방 잠그기</button>
    <select id="modeSelect">
      <option value="chosung" selected>🔤 초성 & 신조어 퀴즈</option>
      <option value="fourchar">4️⃣ 네글자 이어말하기</option>
      <option value="emojiquiz">😎 이모지 퀴즈</option>
      <option value="wordassoc">🧠 연상 퀴즈</option>
      <option value="proverb">📜 속담·사자성어 퀴즈</option>
      <option value="wordchain">🔗 끝말잇기</option>
      <option value="yut">🎲 윷놀이</option>
      <option value="rummikub">🧩 루미큐브</option>
      <option value="gostop">🃏 고스톱</option>
    </select>
    <select id="diffSelect">
      <option value="all">난이도: 전체</option>
      <option value="easy">🟢 쉬움</option>
      <option value="normal">🟡 보통</option>
      <option value="hard">🔴 어려움</option>
    </select>
    <button id="btnToggleBots">🤖 봇 채우기 (현재 0명)</button>
    <button id="btnStart" class="primary">▶ 게임 시작</button>
    <button id="btnNext">⏭ 다음 문제</button>
  </div>
</header>

<div class="invite-banner">
  <div class="invite-bar-inner">
    <div class="invite-group">
      <span style="font-size:0.84rem;font-weight:800;color:#bae6fd;">🎟️ 내 방 초대코드:</span>
      <span id="myRoomCodeText" class="code-box">PARTY1</span>
      <button id="btnCopyCode" class="primary" style="padding:6px 10px;">코드 복사</button>
      <button id="btnCopyLink" class="purple" style="padding:6px 10px;">초대 링크 복사</button>
    </div>
    <div class="invite-group">
      <input id="nicknameInput" type="text" placeholder="내 닉네임" style="width:120px;" />
      <input id="inviteCodeInput" type="text" placeholder="초대코드 입력" maxlength="8" style="width:145px;text-transform:uppercase;" />
      <button id="btnJoinByCode" class="success" style="padding:6px 12px;">초대코드로 입장</button>
    </div>
  </div>
</div>

<div class="main-grid">
  <aside class="card">
    <div class="card-title">
      <span>👥 방 참가자</span>
      <span id="playerCountBadge" style="font-size:0.76rem;color:#38bdf8;"></span>
    </div>
    <div id="playerList" class="player-list"></div>
    <div id="hofBox" class="hof-box"></div>
  </aside>

  <main class="card">
    <div class="stage-header">
      <div id="stageTitle" style="font-weight:800;font-size:1rem;">난이도 필터링 정상 작동 중!</div>
      <div id="timerBox" class="timer-box">⏱ 대기 중</div>
    </div>
    <div id="roomSwitcher" class="room-switcher"></div>
    <div id="stageBody" class="stage-body"></div>
  </main>

  <aside class="card">
    <div class="card-title">💬 방 채팅 & 정답 입력</div>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="chat-input-row">
      <input id="chatInput" type="text" placeholder="정답 또는 채팅 입력 (Enter)..." autocomplete="off" />
      <button type="submit" class="primary">전송</button>
    </form>
  </aside>
</div>

<div id="createRoomModal" class="modal-backdrop">
  <div class="modal-card">
    <div style="font-size:1.2rem;font-weight:900;color:#38bdf8;">🏠 새 파티 방 만들기</div>
    <div class="field-row">
      <label>방 제목</label>
      <input id="newRoomTitle" type="text" value="우리끼리 보드·카드 파티방" />
    </div>
    <div class="field-row">
      <label>최대 인원 (2~10명)</label>
      <select id="newRoomMax">
        <option value="4">4명</option>
        <option value="6">6명</option>
        <option value="8">8명</option>
        <option value="10" selected>10명</option>
      </select>
    </div>
    <div class="field-row">
      <label>기본 게임 모드</label>
      <select id="newRoomMode">
        <option value="chosung" selected>🔤 초성 & 신조어 퀴즈</option>
        <option value="fourchar">4️⃣ 네글자 이어말하기</option>
        <option value="emojiquiz">😎 이모지 퀴즈</option>
        <option value="wordassoc">🧠 연상 퀴즈</option>
        <option value="proverb">📜 속담·사자성어 퀴즈</option>
        <option value="wordchain">🔗 끝말잇기</option>
        <option value="yut">🎲 윷놀이</option>
        <option value="rummikub">🧩 루미큐브</option>
        <option value="gostop">🃏 고스톱</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
      <button id="btnCancelCreateRoom">취소</button>
      <button id="btnConfirmCreateRoom" class="success">방 생성 & 초대코드 발급</button>
    </div>
  </div>
</div>

<script>
(() => {
  const normText = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();
  const parsePack = (raw, fn) => raw.trim().split('\n').map(l => l.trim()).filter(Boolean).map(l => fn(l.split('|')));

  const CHOSUNG_POOL = parsePack(`
    ㄱㄷㅅ|감이 다 살았네! 센스 넘칠 때 쓰는 유행어|감다살|easy
    ㄹㅋㅂㅋ|오히려 좋아를 넘어선 초긍정 마인드|럭키비키|easy
    ㄱㅊㅉㄱ|한국인의 대표 얼큰한 찌개|김치찌개|easy
    ㄸㅂㄲ|매콤달콤한 떡과 어묵 분식|떡볶이|easy
    ㅇㅈㄸㄲㅅ|알아서 잘 딱 깔끔하고 센스 있게|알잘딱깔센|normal
    ㅅㅂㅈ|스스로 불러온 재앙의 줄임말|스불재|normal
    ㅎㅂㅇㄹㅅ|요리 경연 화제작 예능|흑백요리사|normal
    ㅅㄱㅇㅈㅍㅅ|우주와 별을 노래한 대표 록 발라드|사건의지평선|normal
    ㅎㅅㅈㅂㅅㅈ|계급 구도를 내세운 요리 서바이벌 키워드|흑수저백수저|hard
    ㅇㅂㄴㅎㄱ|요리 경연에서 고르게 익히라는 심사평|이븐하게|hard
    ㄲㅂㄱ|비판이나 구설에서도 버텨내는 면책권 신조어|까방권|hard
    ㅂㅋㅊ|버스카드 충전의 줄임말|버카충|hard
  `, ([c, hint, a, diff]) => ({ c, hint, a, diff }));

  const FOURCHAR_POOL = parsePack(`
    대한|민국|우리나라 국호|대한|민국|easy
    일석|이조|한 가지 일로 두 가지 이득을 얻음|일석|이조|easy
    역지|사지|상대방 입장에서 생각해 봄|역지|사지|normal
    유비|무환|미리 준비하면 걱정이 없음|유비|무환|normal
    어부|지리|한쪽이 다투는 틈을 타 다른 쪽이 이득을 봄|어부|지리|hard
    배수|진영|뒤에 물을 두고 결사적으로 싸움|배수|진영|hard
  `, ([front, hint, a, p1, p2, diff]) => ({ front, q: `[ ${front} ] + ( ? ? )`, a, hint, diff }));

  const EMOJI_POOL = parsePack(`
    🍎📱|스마트폰 대표 브랜드|애플|easy
    ❄️👸|디즈니 인기 영화|겨울왕국|easy

    🔥🐔🍜|아주 매운 볶음 라면|불닭볶음면|normal
    🕰️☀️🏖️|여름철 시간을 한 시간 앞당기는 제도|서머타임|hard
    🧙‍♂️🪄🦉|마법 학교 판타지 세계관|해리포터|hard
  `, ([e, hint, a, diff]) => ({ e, hint, a, diff }));

  const WORDASSOC_POOL = parsePack(`
    빨간색|둥글다|백설공주|아삭아삭|사과|easy

    카다이프|피스타치오|두바이|바삭한 초콜릿|두바이초콜릿|hard
    주사위|보드게임|말판|운|보드게임|hard
  `, (parts) => ({ clues: parts.slice(0, -2), a: parts[parts.length - 2], diff: parts[parts.length - 1] }));

  const PROVERB_POOL = parsePack(`
    가는 말이 고와야 (   ) 말이 곱다|오는|남에게 좋게 대해야 남도 나에게 좋게 대함|easy
    소 잃고 (   ) 고친다|외양간|이미 일을 그르친 뒤에 뒤늦게 수습함|easy
    금상첨화: 비단 위에 (   )을 더한다|꽃|좋은 일 위에 또 좋은 일이 더해짐|normal
    동문서답: 물을 (   )에 대답은 서쪽으로 한다|동쪽|질문과 전혀 다른 대답을 함|normal
    어부지리: (   )과 새가 싸우는 틈에 어부가 이득을 봄|조개|남이 다투는 사이에 제삼자가 이득을 봄|hard
    우물에 가서 (   ) 찾는다|숭늉|성급하게 당장 없는 것을 찾음|hard
  `, ([q, a, hint, diff]) => ({ q, a, hint, diff }));

  const CHAIN_WORDS = ['사과', '과자', '자동차', '차표', '표범', '범고래', '래퍼', '퍼즐', '즐거움', '음식', '식당', '당근', '근육', '육상', '상어', '어항', '항구', '구름', '음료', '요거트', '트럼펫', '펭귄', '귀걸이', '이불', '불꽃', '꽃게'];

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function genRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

    { r: 1, c: 4, idx: 7, label: '7' },
    { r: 1, c: 5, idx: 6, label: '6' },
    { r: 2, c: 1, idx: 11, label: '11' },
    { r: 2, c: 5, idx: 5, label: '5', corner: true },
    { r: 3, c: 1, idx: 12, label: '12' },
    { r: 3, c: 3, idx: 20, label: '중앙', center: true },
    { r: 3, c: 5, idx: 4, label: '4' },
    { r: 4, c: 1, idx: 13, label: '13' },
    { r: 4, c: 5, idx: 3, label: '3' },
    { r: 5, c: 1, idx: 15, label: '15', corner: true },
    { r: 5, c: 2, idx: 16, label: '16' },

  const RK_COLORS = [
    { key: 'red', cls: 'c-red', dot: '빨강' },
    { key: 'blue', cls: 'c-blue', dot: '파랑' },
    { key: 'black', cls: 'c-black', dot: '검정' },
    { key: 'orange', cls: 'c-orange', dot: '주황' }
  ];

  function makeTileBag() {
    const bag = [];
    for (let copy = 0; copy < 2; copy++) {
      for (const c of RK_COLORS) {
        for (let num = 1; num <= 13; num++) {
          bag.push({ id: `${c.key}_${num}_${copy}_${Math.random().toString(36).slice(2, 5)}`, color: c.key, num });
        }
      }
    }
    return shuffleArray(bag);
  }

  const HWATU_DECK = [
    { id: '1G', month: 1, art: '🌲☀️', name: '송학 광', type: 'gwang' },
    { id: '3G', month: 3, art: '🌸🏮', name: '벚꽃 광', type: 'gwang' },
    { id: '8G', month: 8, art: '🌕🦅', name: '공산 광', type: 'gwang' },
    { id: '12G', month: 12, art: '🌧️🦉', name: '비 광', type: 'gwang' },
    { id: '2T', month: 2, art: '🌺📜', name: '매조 홍단', type: 'tti' },
    { id: '6T', month: 6, art: '🌷📜', name: '모란 청단', type: 'tti' },
    { id: '7T', month: 7, art: '🌿📜', name: '홍싸리 초단', type: 'tti' },
    { id: '4P', month: 4, art: '🌱🍂', name: '흑싸리 피', type: 'pi' },
    { id: '5P', month: 5, art: '🪻🍃', name: '난초 피', type: 'pi' },

  ];

  const myPeerId = `peer_${Math.random().toString(36).slice(2, 8)}`;

  const state = {
    roomCode: 'PARTY1',
    roomTitle: '우리끼리 보드·카드 파티방',
    maxPlayers: 10,
    locked: false,
    hostId: myPeerId,
    mode: 'chosung',
    difficulty: 'all',
    activeGame: false,
    botsEnabled: false,
    players: [{ id: myPeerId, name: '나 (방장)', char: '😎', isBot: false, score: 0, roomMode: 'play' }],
    qIndex: 0,
    lastWord: '사과',
    yutSticks: [0, 0, 0, 0],
    yutResultText: '윷을 던져 말을 움직여 보세요!',
    yutPieces: [0, 0, 0, 0],
    selectedPiece: 0,
    rkBag: [],
    rkHand: [],
    rkSelected: new Set(),
    rkTable: [],
    gsFloor: [],
    gsHand: [],
    gsCaptured: [],
    gsGoCount: 0,

  function getFilteredPool() {
    const poolMap = {
      chosung: CHOSUNG_POOL,
      fourchar: FOURCHAR_POOL,
      emojiquiz: EMOJI_POOL,
      wordassoc: WORDASSOC_POOL,
      proverb: PROVERB_POOL
    };
    const base = poolMap[state.mode] || CHOSUNG_POOL;
    if (state.difficulty === 'all') return base;
    const filtered = base.filter(q => q.diff === state.difficulty);
    return filtered.length ? filtered : base;
  }

  function initGames() {
    state.yutSticks = [0, 0, 0, 0];
    state.yutResultText = '윷을 던져 말을 움직여 보세요!';
    state.yutPieces = [0, 0, 0, 0];
    state.selectedPiece = 0;

    state.rkBag = makeTileBag();
    state.rkHand = state.rkBag.splice(0, 10);
    state.rkSelected = new Set();
    state.rkTable = [];

    const deck = shuffleArray(HWATU_DECK);
    state.gsFloor = deck.splice(0, 4);
    state.gsHand = deck.splice(0, 6);
    state.gsCaptured = [];
    state.gsGoCount = 0;
    state.gsPromptGo = false;
  }

  function isHost() { return state.hostId === myPeerId; }
  function getMe() { return state.players.find(p => p.id === myPeerId) || { id: myPeerId, name: '나', char: '😎', score: 0, roomMode: 'play' }; }

  function addLog(text, cls = '') {
    const box = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = `chat-msg ${cls}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function addScore(playerId, pts) {
    const p = state.players.find(x => x.id === playerId);
    if (!p) return;
    p.score += pts;
    renderPlayers();
  }

  function diffLabelText(diff) {
    return ({ easy: '🟢 쉬움', normal: '🟡 보통', hard: '🔴 어려움', all: '전체' })[diff] || diff;
  }

  function renderPlayers() {
    const hostFlag = isHost();
    const botCount = state.players.filter(p => p.isBot).length;
    const badge = document.getElementById('roomHeaderBadge');
    badge.textContent = `방: #${state.roomCode} · ${state.locked ? '🔒 잠김' : '🔓 열림'}`;
    badge.className = `room-pill-badge ${state.locked ? 'locked' : ''}`;

    const lockBtn = document.getElementById('btnToggleLock');
    lockBtn.textContent = state.locked ? '🔓 방 열기' : '🔒 방 잠그기';
    lockBtn.className = state.locked ? 'success' : 'warn';
    lockBtn.disabled = !hostFlag;

    document.getElementById('btnToggleBots').textContent = state.botsEnabled
      ? `🤖 봇 빼기 (현재 ${botCount}명)`
      : `🤖 봇 채우기 (현재 ${botCount}명)`;
    document.getElementById('btnToggleBots').disabled = !hostFlag;
    document.getElementById('playerCountBadge').textContent = `${state.players.length}/${state.maxPlayers}명`;

    document.getElementById('playerList').innerHTML = state.players.map((p, idx) => `
      <div class="player-item">
        <div class="player-meta">
          <div class="player-name-row"><span>${idx + 1}. ${p.char} <b>${p.name}</b></span></div>

          </div>
        </div>
        <div class="player-actions">
          <span class="score-pill">${p.score}점</span>
          ${(hostFlag && p.id !== myPeerId) ? `<button class="kick-btn" data-kick="${p.id}">강퇴</button>` : ''}
        </div>
      </div>
    `).join('');

    document.querySelectorAll('[data-kick]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.players = state.players.filter(p => p.id !== btn.dataset.kick);
        renderPlayers();
      });
    });

    document.getElementById('hofBox').innerHTML =
      `현재 난이도: <b>${diffLabelText(state.difficulty)}</b><br/>` +
      `🎲 <b>윷놀이</b> · 🧩 <b>루미큐브</b> · 🃏 <b>고스톱</b>`;

  function renderStage() {
    const body = document.getElementById('stageBody');
    const titleEl = document.getElementById('stageTitle');
    const me = getMe();

    document.getElementById('roomSwitcher').innerHTML = `
      <div class="room-pill-group">
        <button class="room-btn ${me.roomMode === 'play' ? 'active' : ''}" id="btnSetPlay">🎮 게임 참가</button>

      </div>
      <div style="color:#7dd3fc;font-weight:700;">난이도: ${diffLabelText(state.difficulty)}</div>
    `;
    document.getElementById('btnSetPlay').addEventListener('click', () => { me.roomMode = 'play'; renderPlayers(); });
    document.getElementById('btnSetSpectate').addEventListener('click', () => { me.roomMode = 'spectate'; renderPlayers(); });

    if (state.mode === 'yut') {
      titleEl.textContent = '🎲 윷놀이 — 전통 말판 & 윷가락 판정';
      const nodesHtml = YUT_BOARD_CELLS.map(cell => {

      const pieceChips = state.yutPieces.map((pos, idx) =>

      ).join('');

      body.innerHTML = `

          </div>
        </div>
      `;
      document.querySelectorAll('[data-piece]').forEach(el => {
        el.addEventListener('click', () => { state.selectedPiece = Number(el.dataset.piece); renderStage(); });

      document.getElementById('btnThrowYut').addEventListener('click', () => {
        const sticks = [0, 1, 2, 3].map(() => (Math.random() < 0.45 ? 1 : 0));
        const backs = sticks.reduce((a, b) => a + b, 0);
        const move = backs === 0 ? 5 : backs;
        const nameMap = { 1: '도(1칸)', 2: '개(2칸)', 3: '걸(3칸)', 4: '윷(4칸)', 5: '모(5칸)' };
        state.yutSticks = sticks;
        const pIdx = state.selectedPiece;
        let nextPos = state.yutPieces[pIdx] + move;
        if (nextPos > 20) { nextPos = 0; addScore(me.id, 30); }
        else addScore(me.id, move * 5);
        state.yutPieces[pIdx] = nextPos;
        state.yutResultText = `${me.name}: ${nameMap[move]} → 말 ${pIdx + 1} (${nextPos === 0 ? '완주/대기' : `${nextPos}번칸`})`;
        addLog(`🎲 ${state.yutResultText}`, 'win');
        renderStage();
      });
      return;
    }

    if (state.mode === 'rummikub') {

      const chosen = state.rkHand.filter(t => state.rkSelected.has(t.id));
      const validNow = chosen.length >= 3 && (
        chosen.every(t => t.num === chosen[0].num) && new Set(chosen.map(t => t.color)).size === chosen.length ||

      body.innerHTML = `

              </div>
            `).join('') || '<div style="color:#94a3b8;margin:auto;">손패에서 3장 이상 선택 후 등록해 보세요.</div>'}
          </div>
          <div class="rk-rack">
            <div style="display:flex;justify-content:space-between;margin-bottom:10px;">

              <div style="display:flex;gap:8px;">
                <button id="btnPlayRk" class="success" ${validNow ? '' : 'disabled'}>✅ 등록</button>
                <button id="btnDrawRk" class="primary">➕ 뽑기</button>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
              ${state.rkHand.map(t => `<div class="rk-tile-3d c-${t.color} ${state.rkSelected.has(t.id) ? 'selected' : ''}" data-dot="${t.color}" data-rktile="${t.id}">${t.num}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
      document.querySelectorAll('[data-rktile]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.rktile;
          if (state.rkSelected.has(id)) state.rkSelected.delete(id);
          else state.rkSelected.add(id);
          renderStage();
        });
      });
      document.querySelectorAll('[data-reclaim]').forEach(el => {
        el.addEventListener('click', () => {
          const [grp] = state.rkTable.splice(Number(el.dataset.reclaim), 1);
          if (grp) state.rkHand.push(...grp);
          renderStage();

      document.getElementById('btnPlayRk').addEventListener('click', () => {
        state.rkTable.push(chosen);
        state.rkHand = state.rkHand.filter(t => !state.rkSelected.has(t.id));
        state.rkSelected.clear();
        addScore(me.id, chosen.length * 10);
        renderStage();
      });
      document.getElementById('btnDrawRk').addEventListener('click', () => {
        if (!state.rkBag.length) state.rkBag = makeTileBag();
        const t = state.rkBag.pop();
        if (t) state.rkHand.push(t);
        renderStage();
      });
      return;
    }

    if (state.mode === 'gostop') {
      titleEl.textContent = '🃏 고스톱 — 바닥패 매칭 & 화투판';
      const renderHwatu = (c, attr = '') => `
        <div class="hwatu-3d ${c.type}" ${attr ? `${attr}="${c.id}"` : ''}>
          <span class="hwatu-month">${c.month}월</span>
          <span class="hwatu-art">${c.art}</span>
          <span class="hwatu-name">${c.name}</span>
        </div>
      `;
      body.innerHTML = `
        <div class="gs-wrap">
          <div class="gs-felt">
            <div class="gs-zone-label"><span>🃏 바닥패 (${state.gsFloor.length}장)</span><span>먹은 패 ${state.gsCaptured.length}장</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:104px;">
              ${state.gsFloor.map(c => renderHwatu(c)).join('')}
            </div>
          </div>
          <div class="card" style="background:#0c1526;">
            <div class="gs-zone-label"><span style="color:#fde68a;">✋ 내 손패 (${state.gsHand.length}장)</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px;">
              ${state.gsHand.map(c => renderHwatu(c, 'data-gsid')).join('')}
            </div>
          </div>
        </div>
      `;
      document.querySelectorAll('[data-gsid]').forEach(el => {
        el.addEventListener('click', () => {
          const idx = state.gsHand.findIndex(c => c.id === el.dataset.gsid);
          if (idx === -1) return;
          const [card] = state.gsHand.splice(idx, 1);
          const mIdx = state.gsFloor.findIndex(f => f.month === card.month);
          if (mIdx !== -1) {
            const [matched] = state.gsFloor.splice(mIdx, 1);
            state.gsCaptured.push(card, matched);
            addScore(me.id, 10);
            addLog(`🃏 ${card.month}월 매칭! [${card.name}] + [${matched.name}] (+10점)`, 'win');
          } else {
            state.gsFloor.push(card);
            addLog(`🃏 [${card.name}] 바닥에 냄`, 'sys');
          }
          renderStage();
        });
      });
      return;
    }

    const pool = getFilteredPool();
    const q = pool[state.qIndex % pool.length];
    titleEl.textContent = `🎯 퀴즈 (${diffLabelText(state.difficulty)} · ${pool.length}문항)`;
    body.innerHTML = `
      <div class="quiz-box">
        <div class="quiz-badges">
          <span class="quiz-tag">${state.mode}</span>
          <span class="diff-tag diff-${q.diff || 'normal'}">${diffLabelText(q.diff)}</span>
        </div>
        <div class="quiz-main">${q.c || q.q || q.e || (q.clues ? q.clues.join(' · ') : state.lastWord)}</div>
        <div class="quiz-sub">💡 ${q.hint || '채팅창에 정답을 입력하세요'}</div>
      </div>
    `;
  }

  document.getElementById('diffSelect').addEventListener('change', e => {
    state.difficulty = e.target.value;
    state.qIndex = 0;
    const pool = getFilteredPool();
    addLog(`🎚️ 난이도를 [${diffLabelText(state.difficulty)}]로 변경했습니다. (${pool.length}문항)`, 'sys');
    renderPlayers();
    renderStage();
  });

  document.getElementById('modeSelect').addEventListener('change', e => {
    state.mode = e.target.value;
    state.qIndex = 0;
    initGames();
    renderStage();
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    const pool = getFilteredPool();
    if (pool.length) addLog(`💡 정답: "${pool[state.qIndex % pool.length].a}"`, 'sys');
    state.qIndex++;
    renderStage();
  });

  document.getElementById('btnStart').addEventListener('click', () => {
    state.activeGame = true;
    state.qIndex = 0;
    initGames();
    addLog(`▶ [${diffLabelText(state.difficulty)}] 난이도로 게임을 시작합니다!`, 'sys');
    renderStage();
  });

  document.getElementById('btnToggleBots').addEventListener('click', () => {
    if (!state.botsEnabled) {
      state.players.push({ id: 'b1', name: '알파봇', char: '🤖', isBot: true, score: 0, roomMode: 'play' });
      state.botsEnabled = true;
    } else {
      state.players = state.players.filter(p => !p.isBot);
      state.botsEnabled = false;
    }
    renderPlayers();
  });

  document.getElementById('btnToggleLock').addEventListener('click', () => {
    state.locked = !state.locked;
    renderPlayers();
  });

  document.getElementById('btnOpenCreateRoom').addEventListener('click', () => document.getElementById('createRoomModal').classList.add('open'));
  document.getElementById('btnCancelCreateRoom').addEventListener('click', () => document.getElementById('createRoomModal').classList.remove('open'));
  document.getElementById('btnConfirmCreateRoom').addEventListener('click', () => {
    state.roomTitle = document.getElementById('newRoomTitle').value.trim() || '새 방';
    state.maxPlayers = Number(document.getElementById('newRoomMax').value) || 10;
    state.mode = document.getElementById('newRoomMode').value;
    state.roomCode = genRoomCode();
    state.qIndex = 0;
    document.getElementById('modeSelect').value = state.mode;
    document.getElementById('myRoomCodeText').textContent = state.roomCode;
    document.getElementById('createRoomModal').classList.remove('open');
    initGames();
    renderPlayers();
    renderStage();
  });

  document.getElementById('btnCopyCode').addEventListener('click', () => {
    navigator.clipboard?.writeText(state.roomCode).catch(() => {});
    addLog(`📋 초대코드 [${state.roomCode}] 복사 완료`, 'sys');
  });

  document.getElementById('btnCopyLink').addEventListener('click', () => {
    const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(state.roomCode)}`;
    navigator.clipboard?.writeText(url).catch(() => {});
    addLog(`🔗 초대 링크 복사 완료`, 'sys');
  });

  document.getElementById('btnJoinByCode').addEventListener('click', () => {
    const code = document.getElementById('inviteCodeInput').value.trim().toUpperCase();
    if (!code) return;
    state.roomCode = code;
    document.getElementById('myRoomCodeText').textContent = code;
    addLog(`🎟️ [#${code}] 방으로 전환했습니다.`, 'sys');
    renderPlayers();
  });

  document.getElementById('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('chatInput');
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    const me = getMe();
    addLog(`${me.char} ${me.name}: ${txt}`);
    const pool = getFilteredPool();
    const q = pool[state.qIndex % pool.length];
    if (q && normText(txt) === normText(q.a)) {
      addLog(`🎉 [${me.name}] 정답! "${q.a}" (+25점)`, 'win');
      addScore(me.id, 25);
      state.qIndex++;
      renderStage();
    }
  });

  initGames();
  renderPlayers();
  renderStage();
  addLog('🎮 v3.1 난이도 필터링 버그 수정 완료! 상단 난이도를 바꿔보세요.', 'sys');
})();
</script>
</body>
</html>
