<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>10인 파티 허브 v4.0 — 파티 테이블 아레나</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #060b16;
    --panel: rgba(15, 24, 44, 0.88);
    --panel-2: rgba(23, 37, 66, 0.92);
    --border: rgba(96, 165, 250, 0.28);
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --accent: #f59e0b;
    --success: #10b981;
    --danger: #ef4444;
    --purple: #8b5cf6;
    --theme-glow: rgba(59, 130, 246, 0.25);
  }
  body.theme-yut { --theme-glow: rgba(245, 158, 11, 0.32); }
  body.theme-rummikub { --theme-glow: rgba(16, 185, 129, 0.28); }
  body.theme-gostop { --theme-glow: rgba(34, 197, 94, 0.34); }
  body.theme-liar { --theme-glow: rgba(239, 68, 68, 0.32); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--theme-glow) 0%, #0a1224 45%, var(--bg) 85%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.4s ease;
    overflow-x: hidden;
  }

  /* 3D 아케이드 버튼 & 인풋 */
  select, input, button {
    font-family: inherit;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 12px;
    font-size: 0.85rem;
  }
  input:focus, select:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
  button {
    cursor: pointer;
    font-weight: 800;
    border-bottom: 3px solid rgba(0, 0, 0, 0.45);
    transition: transform 0.1s ease, filter 0.15s ease;
    user-select: none;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-color: #60a5fa; border-bottom-color: #1e3a8a; }
  button.success { background: linear-gradient(180deg, #10b981, #047857); border-color: #34d399; border-bottom-color: #064e3b; color: #ecfdf5; }
  button.warn { background: linear-gradient(180deg, #f59e0b, #b45309); border-color: #fcd34d; border-bottom-color: #78350f; color: #fffbeb; }
  button.danger { background: linear-gradient(180deg, #ef4444, #b91c1c); border-color: #fca5a5; border-bottom-color: #7f1d1d; }
  button.purple { background: linear-gradient(180deg, #8b5cf6, #6d28d9); border-color: #c4b5fd; border-bottom-color: #4c1d95; }

  /* 상단 헤더 */
  header {
    background: rgba(6, 11, 22, 0.9);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 60;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand-title { font-size: 1.05rem; font-weight: 900; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .room-pill {
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(52, 211, 153, 0.45);
    color: #6ee7b7;
    font-size: 0.76rem;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 800;
  }
  .room-pill.locked { background: rgba(239, 68, 68, 0.18); border-color: rgba(248, 113, 113, 0.5); color: #fca5a5; }
  .net-badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; background: rgba(56, 189, 248, 0.14); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 700; }
  .controls-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

  /* 게임 모드 가로 탭 바 */
  .mode-ribbon {
    max-width: 1700px; width: 100%; margin: 10px auto 0; padding: 0 12px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  .mode-ribbon::-webkit-scrollbar { display: none; }
  .mode-tab {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 12px;
    background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border);
    color: #cbd5e1; font-size: 0.8rem; font-weight: 800; white-space: nowrap;
  }
  .mode-tab.active {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-color: #93c5fd; color: #fff;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
  }

  /* 프로필 & 초대 바 */
  .subbar-wrap { max-width: 1700px; width: 100%; margin: 8px auto 0; padding: 0 12px; }
  .subbar-card {
    background: linear-gradient(90deg, rgba(30, 58, 138, 0.34), rgba(88, 28, 135, 0.28));
    border: 1px solid rgba(96, 165, 250, 0.32);
    border-radius: 14px;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .bar-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .code-box {
    background: #050a14; border: 1px solid #38bdf8; color: #7dd3fc;
    font-weight: 900; letter-spacing: 2px; padding: 5px 10px; border-radius: 8px; font-size: 0.86rem;
  }
  .char-picker { display: flex; flex-wrap: wrap; gap: 4px; }
  .char-btn {
    width: 31px; height: 31px; padding: 0; border-radius: 8px;
    background: #091120; border: 1px solid var(--border); font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .char-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35); }

  /* 메인 레이아웃 */
  .main-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    gap: 12px;
    padding: 12px;
    max-width: 1700px;
    width: 100%;
    margin: 0 auto;
  }
  @media (max-width: 1200px) {
    .main-grid { grid-template-columns: 1fr; padding-bottom: 130px; }
  }

  .card {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 13px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
  }
  .card-title {
    font-size: 0.92rem; font-weight: 900; color: #f1f5f9;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); padding-bottom: 7px;
  }

  /* 참가자 목록 */
  .player-list { display: flex; flex-direction: column; gap: 6px; max-height: 350px; overflow-y: auto; }
  .player-item {
    background: var(--panel-2); padding: 8px 10px; border-radius: 11px;
    border: 1px solid rgba(148, 163, 184, 0.14);
    display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.82rem;
  }
  .player-item.me { border-color: rgba(56, 189, 248, 0.6); background: rgba(30, 58, 138, 0.36); }
  .score-pill { background: #070d19; padding: 3px 9px; border-radius: 999px; font-weight: 900; color: #fbbf24; font-size: 0.78rem; }
  .tag-mini { font-size: 0.66rem; padding: 1px 6px; border-radius: 999px; background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
  .tag-mini.host { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }

  /* 파티 테이블 아레나 (전 게임 공통 둘러앉기 무대) */
  .arena-header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    background: #070d19; padding: 9px 13px; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.18);
  }
  .table-seats-bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    background: radial-gradient(ellipse at center, rgba(30, 58, 138, 0.35), rgba(9, 15, 28, 0.9));
    border: 1px solid rgba(96, 165, 250, 0.28);
    border-radius: 16px;
    padding: 10px;
  }
  .seat-card {
    position: relative;
    min-width: 84px;
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid rgba(148, 163, 184, 0.24);
    border-radius: 14px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: transform 0.18s, border-color 0.2s, box-shadow 0.2s;
  }
  .seat-card.me { border-color: #38bdf8; }
  .seat-card.turn {
    border-color: #fbbf24;
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.45);
    transform: translateY(-2px);
  }
  .seat-card.votable { cursor: pointer; border-color: #f87171; }
  .seat-card.votable:hover { transform: scale(1.05); background: rgba(127, 29, 29, 0.45); }
  .seat-crown { position: absolute; top: -9px; left: 6px; font-size: 0.85rem; }
  .seat-vote-badge {
    position: absolute; top: -8px; right: -6px;
    background: #ef4444; color: #fff; font-size: 0.66rem; font-weight: 900;
    padding: 1px 6px; border-radius: 999px; border: 1.5px solid #fff;
  }
  .seat-bubble {
    position: absolute; top: -24px;
    background: #f8fafc; color: #0f172a; font-size: 0.78rem; font-weight: 900;
    padding: 2px 8px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    animation: popFloat 1.8s ease forwards; pointer-events: none; white-space: nowrap;
  }
  @keyframes popFloat {
    0% { opacity: 0; transform: translateY(6px) scale(0.8); }
    15% { opacity: 1; transform: translateY(0) scale(1.08); }
    80% { opacity: 1; transform: translateY(-4px) scale(1); }
    100% { opacity: 0; transform: translateY(-12px) scale(0.9); }
  }
  .seat-avatar { font-size: 1.45rem; line-height: 1.1; }
  .seat-name { font-size: 0.74rem; font-weight: 800; max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat-pts { font-size: 0.7rem; font-weight: 900; color: #fbbf24; }

  .stage-felt {
    flex: 1;
    min-height: 430px;
    background: radial-gradient(circle at center, #0e1a30 0%, #060b15 100%);
    border: 2px solid rgba(96, 165, 250, 0.35);
    box-shadow: inset 0 0 36px rgba(0, 0, 0, 0.65);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 퀵 리액션 바 */
  .reaction-strip { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .react-btn {
    padding: 5px 11px; border-radius: 999px; font-size: 0.95rem;
    background: #0b1324; border: 1px solid var(--border);
  }

  /* 윷놀이 UI */
  .yut-layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; width: 100%; max-width: 860px; align-items: center; }
  @media (max-width: 820px) { .yut-layout { grid-template-columns: 1fr; } }
  .yut-board-wrap {
    width: 316px; height: 316px; margin: 0 auto;
    background: linear-gradient(145deg, #452814, #241308);
    border: 4px solid #d97706; border-radius: 22px; padding: 12px;
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px;
    box-shadow: 0 14px 28px rgba(0,0,0,0.55);
  }
  .yut-node {
    background: #fef3c7; color: #291506; border-radius: 50%; border: 2px solid #92400e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.66rem; font-weight: 900; position: relative;
  }
  .yut-node.corner { background: #fde047; border: 2.5px solid #d97706; }
  .yut-node.center { background: radial-gradient(circle, #fef08a, #f59e0b); border: 3px solid #78350f; transform: scale(1.12); }
  .yut-node.has-my { box-shadow: 0 0 0 3px #38bdf8, 0 0 12px #38bdf8; background: #dbeafe; }
  .yut-node.has-opp { box-shadow: 0 0 0 3px #f87171; background: #fee2e2; }
  .yut-badge {
    position: absolute; top: -6px; right: -6px; font-size: 0.58rem; font-weight: 900;
    padding: 1px 5px; border-radius: 999px; color: #fff; border: 1px solid #fff;
  }
  .yut-badge.my { background: #2563eb; }
  .yut-badge.opp { background: #dc2626; }
  .yut-sticks-row { display: flex; gap: 10px; justify-content: center; padding: 12px; background: #080f1c; border-radius: 12px; border: 1px solid var(--border); }
  .yut-stick {
    width: 32px; height: 104px; border-radius: 14px;
    background: linear-gradient(90deg, #e7c68c, #fffbeb 45%, #c79c5b);
    border: 2px solid #855320; display: flex; flex-direction: column; align-items: center; justify-content: space-around;
    color: #4a2c0f; font-weight: 900; font-size: 0.75rem;
  }
  .yut-stick.back { background: linear-gradient(90deg, #b45309, #f59e0b 50%, #92400e); border-color: #fde68a; color: #fff; }
  .piece-chip { padding: 6px 10px; border-radius: 10px; background: #091120; border: 1px solid var(--border); font-size: 0.78rem; font-weight: 800; }
  .piece-chip.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.22); color: #bae6fd; }

  /* 루미큐브 UI */
  .rk-wrap { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 12px; }
  .rk-board {
    min-height: 145px; background: radial-gradient(circle at top, #0f3329, #081c16);
    border: 2px solid #10b981; border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 9px;
  }
  .rk-meld {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(110, 231, 183, 0.35);
    border-radius: 11px; padding: 6px 8px; display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .rk-rack { background: linear-gradient(180deg, #362214, #1c1008); border: 2px solid #855320; border-radius: 16px; padding: 12px; }
  .rk-tile {
    width: 42px; height: 58px; border-radius: 8px;
    background: linear-gradient(180deg, #fffef8, #f3ebd2);
    border: 1px solid #d6c7a1; border-bottom: 5px solid #b8a374;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 1.12rem; cursor: pointer; position: relative; transition: transform 0.12s;
  }
  .rk-tile.selected { transform: translateY(-10px); box-shadow: 0 0 0 3px #38bdf8; }
  .c-red { color: #dc2626; } .c-blue { color: #1d4ed8; } .c-black { color: #111827; } .c-orange { color: #ea580c; }

  /* 고스톱 UI */
  .gs-wrap { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 10px; }
  .gs-felt { background: radial-gradient(circle at center, #15803d, #052e16); border: 3px solid #4ade80; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .hwatu {
    width: 64px; height: 92px; border-radius: 9px;
    background: linear-gradient(160deg, #fffdf9, #f5efe2);
    border: 2px solid #cbd5e1; border-bottom: 5px solid #64748b;
    color: #0f172a; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    cursor: pointer; transition: transform 0.12s;
  }
  .hwatu:hover { transform: translateY(-6px); }
  .hwatu.highlight { box-shadow: 0 0 0 3px #fde047, 0 0 14px #fde047; }
  .hwatu.gwang { background: linear-gradient(160deg, #fef9c3, #fde047); border-color: #eab308; border-bottom-color: #a16207; }
  .hwatu.tti { background: linear-gradient(160deg, #ffe4e6, #fecdd3); border-color: #f43f5e; border-bottom-color: #be123c; }

  /* 퀴즈 & 라이어 카드 */
  .quiz-box { text-align: center; max-width: 740px; width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .quiz-main {
    font-size: 1.85rem; font-weight: 900; line-height: 1.38;
    background: linear-gradient(180deg, #162646, #0d172c);
    padding: 22px; border-radius: 16px; border: 1px solid rgba(96, 165, 250, 0.35); width: 100%;
  }
  .secret-card {
    width: 100%; max-width: 420px; min-height: 145px;
    background: linear-gradient(135deg, #1e1b4b, #312e81);
    border: 2px solid #818cf8; border-radius: 18px; padding: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; user-select: none; box-shadow: 0 12px 28px rgba(0,0,0,0.45);
  }
  .secret-card.revealed.liar { background: linear-gradient(135deg, #7f1d1d, #991b1b); border-color: #fca5a5; }
  .secret-card.revealed.citizen { background: linear-gradient(135deg, #064e3b, #065f46); border-color: #6ee7b7; }

  /* 채팅 & 입력 */
  .chat-log {
    flex: 1; min-height: 310px; max-height: 460px; overflow-y: auto;
    background: #060b15; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.83rem;
  }
  .chat-msg { line-height: 1.42; word-break: break-word; padding: 4px 7px; border-radius: 7px; background: rgba(255,255,255,0.02); }
  .chat-msg.sys { color: #38bdf8; font-weight: 700; background: rgba(56, 189, 248, 0.08); }
  .chat-msg.win { color: #34d399; font-weight: 800; background: rgba(16, 185, 129, 0.13); }
  .chat-msg.danger { color: #f87171; font-weight: 700; background: rgba(239, 68, 68, 0.11); }

  /* 모바일 하단 고정 엄지 도크 */
  .mobile-thumb-dock {
    display: none;
  }
  @media (max-width: 1200px) {
    .mobile-thumb-dock {
      display: flex; flex-direction: column; gap: 6px;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 80;
      background: rgba(7, 13, 26, 0.96); backdrop-filter: blur(14px);
      border-top: 1px solid #38bdf8; padding: 8px 10px;
    }
    .desktop-inputs { display: none; }
  }

  /* 축하 콤보 팝업 & 콘페티 */
  .fx-toast {
    position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(0.7);
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; font-size: 1.45rem; font-weight: 900; padding: 12px 26px;
    border-radius: 999px; border: 2px solid #fef08a; box-shadow: 0 12px 32px rgba(245, 158, 11, 0.55);
    z-index: 1200; opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  .fx-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .confetti-piece {
    position: fixed; width: 9px; height: 14px; top: -20px; z-index: 1199; pointer-events: none;
    animation: fallConfetti 1.8s linear forwards;
  }
  @keyframes fallConfetti {
    to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  /* 모달 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.84); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal-card { background: #0f192e; border: 2px solid #38bdf8; border-radius: 18px; max-width: 480px; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<div id="fxToast" class="fx-toast">🎉 정답! +25 PTS</div>

<header>
  <div class="brand">
    <span class="brand-title">🎮 10인 파티 허브 v4.0</span>
    <span id="roomHeaderBadge" class="room-pill">방: #PARTY1 · 🔓 열림</span>
    <span id="netStatusBadge" class="net-badge">📡 P2P 대기</span>
  </div>
  <div class="controls-bar">
    <button id="btnOpenCreateRoom" class="success">🏠 방 만들기</button>
    <button id="btnToggleLock" class="warn">🔒 방 잠그기</button>
    <select id="diffSelect">
      <option value="all">난이도: 전체</option>
      <option value="easy">🟢 쉬움</option>
      <option value="normal">🟡 보통</option>
      <option value="hard">🔴 어려움</option>
    </select>
    <button id="btnToggleBots">🤖 봇 채우기</button>
    <button id="btnStart" class="primary">▶ 시작/리셋</button>
    <button id="btnNext">⏭ 다음</button>
  </div>
</header>

<nav id="modeRibbon" class="mode-ribbon"></nav>

<div class="subbar-wrap">
  <div class="subbar-card">
    <div class="bar-group">

    p.bubble = emoji;
    renderSeats();
    setTimeout(() => {
      if (p.bubble === emoji) {
        p.bubble = '';
        renderSeats();
      }
    }, 1700);
  }

  /* ================= P2P + BroadcastChannel 실시간 방 연동 ================= */
  function sendNet(data) {
    const payload = { ...data, senderId: myId };
    bc?.postMessage(payload);
    conns.forEach(c => { if (c.open) c.send(payload); });
  }

  function handleNetMessage(msg) {
    if (!msg || msg.senderId === myId) return;
    if (msg.type === 'chat') {
      addLog(msg.text, msg.cls, false);
    } else if (msg.type === 'react') {
      showSeatBubble(msg.playerId, msg.emoji);
    } else if (msg.type === 'join_req') {
      if (state.locked) return;
      const exists = state.players.find(p => p.id === msg.player.id);
      if (!exists && state.players.length < state.maxPlayers) {
        state.players.push(msg.player);
        addLog(`🎉 ${msg.player.char} ${msg.player.name}님이 방에 입장했습니다!`, 'win', false);
      } else if (exists) {
        Object.assign(exists, msg.player);
      }
      renderAll();
      sendNet({ type: 'sync_players', players: state.players, mode: state.mode, difficulty: state.difficulty, qIndex: state.qIndex });
    } else if (msg.type === 'sync_players') {
      if (Array.isArray(msg.players)) {
        state.players = msg.players;
        if (!state.players.some(p => p.id === myId)) {
          state.players.unshift({ id: myId, name: '나', char: '😎', isBot: false, score: 0, bubble: '' });
        }
      }
      if (msg.mode) state.mode = msg.mode;
      if (msg.difficulty) state.difficulty = msg.difficulty;
      if (typeof msg.qIndex === 'number') state.qIndex = msg.qIndex;
      renderAll();
    } else if (msg.type === 'sync_round') {
      state.mode = msg.mode;
      state.difficulty = msg.difficulty;
      state.qIndex = msg.qIndex;
      state.lastWord = msg.lastWord || state.lastWord;
      state.usedWords = msg.usedWords || state.usedWords;
      if (msg.liar) state.liar = msg.liar;
      renderAll();
    } else if (msg.type === 'liar_vote') {
      state.liar.votes[msg.voterId] = msg.targetId;
      renderStage();
    }
  }

  function connectRoomNetwork(asGuest = false) {
    if (bc) bc.close();
    if ('BroadcastChannel' in window) {
      bc = new BroadcastChannel(`party_hub_${state.roomCode}`);
      bc.onmessage = (e) => handleNetMessage(e.data);
    }

    if (peer) { try { peer.destroy(); } catch {} }
    conns.clear();
    const netBadge = document.getElementById('netStatusBadge');
    if (typeof Peer === 'undefined') {
      netBadge.textContent = '📡 로컬 동기화';
      return;
    }

    const hostPeerId = `kcm_party_room_${state.roomCode}`;
    peer = new Peer(asGuest ? undefined : hostPeerId);

    peer.on('open', () => {
      if (!asGuest) {
        state.hostId = myId;
        netBadge.textContent = `📡 방장 호스팅 중 (#${state.roomCode})`;
      } else {
        netBadge.textContent = `📡 방 연결 중...`;
        const conn = peer.connect(hostPeerId);
        conn.on('open', () => {
          conns.set(hostPeerId, conn);
          netBadge.textContent = `📡 실시간 연결됨 (#${state.roomCode})`;
          sendNet({ type: 'join_req', player: getMe() });
        });
        conn.on('data', handleNetMessage);
      }
      renderPlayers();
    });

    peer.on('connection', (conn) => {
      conns.set(conn.peer, conn);
      conn.on('data', handleNetMessage);
      conn.on('open', () => {
        sendNet({ type: 'sync_players', players: state.players, mode: state.mode, difficulty: state.difficulty, qIndex: state.qIndex });
      });
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id' && !asGuest) {
        // 이미 같은 방 코드의 방장이 있으면 게스트로 자동 연결
        connectRoomNetwork(true);
      } else {
        netBadge.textContent = '📡 로컬/링크 모드';
      }
    });
  }

  /* ================= 퀴즈 & 라이어 초기화 ================= */
  function getPool(mode = state.mode) {
    const map = {
      chosung: CHOSUNG_POOL,
      proverb: PROVERB_POOL,
      emojiquiz: EMOJI_POOL,
      wordassoc: WORDASSOC_POOL,
      fourchar: FOURCHAR_POOL
    };
    const raw = map[mode] || CHOSUNG_POOL;
    const filtered = state.difficulty === 'all' ? raw : raw.filter(x => x.diff === state.difficulty);
    const base = filtered.length ? filtered : raw;
    const key = `${mode}_${state.difficulty}`;
    if (!state.shuffledPools[key] || state.shuffledPools[key].length !== base.length) {
      state.shuffledPools[key] = shuffle(base);
    }
    return state.shuffledPools[key];
  }

  function startLiarRound() {
    const topics = Object.keys(LIAR_TOPICS);
    if (!topics.includes(state.liar.topic)) state.liar.topic = topics[0];
    const participants = state.players;
    const liarPlayer = participants[Math.floor(Math.random() * participants.length)] || getMe();

    let citizenWord = '';
    let liarWord = '';
    if (state.liar.foolMode) {
      const pair = LIAR_FOOL_PAIRS[Math.floor(Math.random() * LIAR_FOOL_PAIRS.length)];
      citizenWord = pair[0];
      liarWord = pair[1];
    } else {
      const list = LIAR_TOPICS[state.liar.topic];
      citizenWord = list[Math.floor(Math.random() * list.length)];
      liarWord = '';
    }

    state.liar = {
      ...state.liar,
      phase: 'card',
      liarId: liarPlayer.id,
      citizenWord,
      liarWord,
      revealed: false,
      votes: {},
      clues: []
    };
    state.turnIndex = 0;
  }

  function initBoardGames() {
    state.yut = {
      sticks: [0, 0, 0, 0],
      msg: '윷을 던져 말을 이동하세요! (5·10·20번 지름길 & 잡기/업기 지원)',
      myPieces: [0, 0, 0, 0],
      oppPieces: [4, 9, 0, 0],
      selectedPiece: 0,
      bonusTurn: false
    };

    const bag = [];
    for (let copy = 0; copy < 2; copy++) {
      for (const color of ['red', 'blue', 'black', 'orange']) {
        for (let num = 1; num <= 13; num++) {
          bag.push({ id: `${color}_${num}_${copy}_${Math.random().toString(36).slice(2,5)}`, color, num });
        }
      }
    }
    const shuffledBag = shuffle(bag);
    const hand = shuffledBag.splice(0, 12);
    state.rk = {
      bag: shuffledBag,
      hand,
      turnSnapshot: { hand: [...hand], table: [] },
      selected: new Set(),
      table: [],
      opened30: false,
      require30: true
    };

    const deck = shuffle(HWATU_DECK);
    state.gs = {
      deck,
      floor: deck.splice(0, 6),
      hand: deck.splice(0, 7),
      myCap: [],
      oppCap: [],
      goCount: 0,
      awaitingGoStop: false,
      lastPoints: 0
    };

    const starter = CHAIN_DICT[Math.floor(Math.random() * CHAIN_DICT.length)];
    state.lastWord = starter;
    state.usedWords = [starter];
  }

  /* ================= 윷놀이 / 루미큐브 / 고스톱 정밀 로직 ================= */
  function stepYutPosition(pos, steps) {
    let cur = pos;
    for (let s = 0; s < steps; s++) {
      if (cur === 0 && s === 0) { cur = 1; continue; }
      // 첫 칸 진입 시 지름길 분기 적용
      if (s === 0 && pos === 5) { cur = 21; continue; }
      if (s === 0 && pos === 10) { cur = 23; continue; }
      if (s === 0 && pos === 20) { cur = 22; continue; }

      if (cur === 21) cur = 20;
      else if (cur === 20) cur = 22;
      else if (cur === 22) cur = 0; // 완주
      else if (cur === 23) cur = 20;
      else if (cur === 24) cur = 15;
      else if (cur === 18) cur = 0; // 완주
      else if (cur === 0 && s > 0) return 99; // 완주 통과
      else cur += 1;

      if (cur === 0 && s > 0) return 99;
    }
    return cur;
  }

  function validateRkMeld(tiles) {
    if (tiles.length < 3) return { ok: false, pts: 0 };
    const pts = tiles.reduce((a, b) => a + b.num, 0);
    // 그룹: 같은 숫자, 서로 다른 색 (3~4장)
    const sameNum = tiles.every(t => t.num === tiles[0].num);
    const diffColors = new Set(tiles.map(t => t.color)).size === tiles.length;
    if (sameNum && diffColors && tiles.length <= 4) return { ok: true, pts };

    // 런: 같은 색, 연속 숫자
    const sameColor = tiles.every(t => t.color === tiles[0].color);
    if (sameColor) {
      const sorted = [...tiles].sort((a, b) => a.num - b.num);
      let seq = true;
      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i].num !== sorted[i - 1].num + 1) { seq = false; break; }
      }
      if (seq) return { ok: true, pts };
    }
    return { ok: false, pts };
  }

  function calcGostopScore(cards) {
    const gwangs = cards.filter(c => c.type === 'gwang');
    const yeols = cards.filter(c => c.type === 'yeol');
    const ttis = cards.filter(c => c.type === 'tti');
    const piCount = cards.reduce((sum, c) => sum + (c.type === 'pi2' ? 2 : (c.type === 'pi' ? 1 : 0)), 0);

    let pts = 0;
    if (gwangs.length >= 3) {
      const hasRain = gwangs.some(c => c.month === 12);
      pts += gwangs.length === 5 ? 15 : gwangs.length === 4 ? 4 : (hasRain ? 2 : 3);
    }
    if (yeols.length >= 5) pts += (yeols.length - 4);
    if (ttis.length >= 5) pts += (ttis.length - 4);
    if (piCount >= 10) pts += (piCount - 9);
    return { pts, gwangCnt: gwangs.length, piCount };
  }

        renderAll();

  function renderSeats() {
    const bar = document.getElementById('tableSeatsBar');
    const maxScore = Math.max(...state.players.map(p => p.score), 0);
    const voteCounts = {};
    Object.values(state.liar.votes || {}).forEach(tid => { voteCounts[tid] = (voteCounts[tid] || 0) + 1; });
    const canVote = state.mode === 'liar' && state.liar.phase === 'vote';

    bar.innerHTML = state.players.map((p, idx) => {
      const isLeader = maxScore > 0 && p.score === maxScore;
      const isTurn = idx === (state.turnIndex % state.players.length);
      const votes = voteCounts[p.id] || 0;
      return `
        <div class="seat-card ${p.id === myId ? 'me' : ''} ${isTurn ? 'turn' : ''} ${canVote ? 'votable' : ''}" data-seat="${p.id}">

      felt.innerHTML = `
        <div class="yut-layout">
          <div class="yut-board-wrap">${nodesHtml}</div>
          <div style="display:flex;flex-direction:column;gap:12px;background:rgba(15,23,42,0.9);border:1px solid var(--border);border-radius:16px;padding:14px;">
            <div style="font-size:1rem;font-weight:900;color:#fde68a;">${state.yut.msg}</div>
            <div class="yut-sticks-row">${sticksHtml}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">${chipsHtml}</div>
            <button id="btnThrowYut" class="warn" style="padding:12px;font-size:1rem;">🎲 윷 던지기</button>
          </div>
        </div>
      `;

      felt.querySelectorAll('[data-yp]').forEach(b => b.addEventListener('click', () => {
        state.yut.selectedPiece = Number(b.dataset.yp);
        renderStage();
      }));

      document.getElementById('btnThrowYut').addEventListener('click', () => {
        const sticks = [0, 1, 2, 3].map(() => Math.random() < 0.45 ? 1 : 0);
        const backs = sticks.reduce((a, b) => a + b, 0);
        const move = backs === 0 ? 5 : backs;
        const names = { 1: '도(1칸)', 2: '개(2칸)', 3: '걸(3칸)', 4: '윷(4칸)', 5: '모(5칸)' };
        state.yut.sticks = sticks;

        let pIdx = state.yut.selectedPiece;
        if (state.yut.myPieces[pIdx] === 99) {
          const avail = state.yut.myPieces.findIndex(x => x !== 99);
          if (avail !== -1) pIdx = avail;
        }
        const curPos = state.yut.myPieces[pIdx];
        const nextPos = stepYutPosition(curPos, move);

        // 업혀 있는 아군 말 모두 함께 이동
        const movingIndices = curPos > 0 && curPos < 99
          ? state.yut.myPieces.map((v, i) => v === curPos ? i : -1).filter(i => i !== -1)
          : [pIdx];

        movingIndices.forEach(i => { state.yut.myPieces[i] = nextPos; });

        let caught = 0;
        if (nextPos > 0 && nextPos < 99) {
          state.yut.oppPieces = state.yut.oppPieces.map(op => {
            if (op === nextPos) { caught++; return 0; }
            return op;
          });
        }

        const extra = (move === 4 || move === 5 || caught > 0);
        state.yut.bonusTurn = extra;
        const pts = (nextPos === 99 ? 40 * movingIndices.length : move * 5) + (caught * 25);
        addScore(me.id, pts);

        if (caught > 0) {
          triggerFx(`💥 상대 말 ${caught}개 잡았다! 보너스 턴!`);
          state.yut.msg = `${names[move]}! 상대 말 ${caught}개 잡기 성공! 한 번 더 던지세요!`;
        } else if (nextPos === 99) {
          triggerFx(`🏆 말 ${movingIndices.length}개 완주! +${pts} PTS`);
          state.yut.msg = `${names[move]}! 말 ${movingIndices.map(i=>i+1).join(',')} 완주 성공!`;
        } else {
          state.yut.msg = `${names[move]} → ${nextPos}번 칸 이동! ${extra ? '(윷/모 보너스 턴!)' : ''}`;
        }
        addLog(`🎲 ${me.name}: ${state.yut.msg}`, 'win');
        renderStage();
      });
      return;
    }

    /* 3. 루미큐브 */
    if (state.mode === 'rummikub') {
      titleEl.textContent = '🧩 루미큐브 — 그룹·런 검증 & 30점 등록';
      const chosen = state.rk.hand.filter(t => state.rk.selected.has(t.id));
      const check = validateRkMeld(chosen);
      const canPlay = check.ok && (state.rk.opened30 || !state.rk.require30 || check.pts >= 30);

      metaEl.textContent = state.rk.opened30 ? '✅ 첫 등록 완료' : `첫 등록 필요 (${check.pts}/30점)`;
      guideEl.innerHTML = `<b>루미큐브 규칙:</b> 같은 숫자·다른 색(그룹) 또는 같은 색·연속 숫자(런) 3장 이상 선택! 첫 등록은 합계 30점 이상이어야 합니다.`;

      felt.innerHTML = `
        <div class="rk-wrap">
          <div class="rk-board">
            ${state.rk.table.map((grp, gIdx) => `
              <div class="rk-meld" data-reclaim="${gIdx}">
                <span style="font-size:0.7rem;color:#6ee7b7;font-weight:800;">#${gIdx+1}</span>
                ${grp.map(t => `<div class="rk-tile c-${t.color}" style="width:34px;height:46px;font-size:0.9rem;">${t.num}</div>`).join('')}
              </div>
            `).join('') || '<div style="color:#94a3b8;margin:auto;">아래 손패에서 타일을 선택해 테이블에 등록하세요.</div>'}
          </div>
          <div class="rk-rack">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
              <span style="color:#fde68a;font-weight:800;">✋ 내 손패 (${state.rk.hand.length}장) · 선택 합계: ${check.pts}점</span>
              <div style="display:flex;gap:6px;">
                <button id="btnRkPlay" class="success" ${canPlay ? '' : 'disabled'}>✅ 등록</button>
                <button id="btnRkDraw" class="primary">➕ 뽑기</button>
                <button id="btnRkResetTurn" class="warn">↩ 턴 초기화</button>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
              ${state.rk.hand.map(t => `<div class="rk-tile c-${t.color} ${state.rk.selected.has(t.id) ? 'selected' : ''}" data-rkt="${t.id}">${t.num}</div>`).join('')}
            </div>
          </div>
        </div>
      `;

      felt.querySelectorAll('[data-rkt]').forEach(el => el.addEventListener('click', () => {
        const id = el.dataset.rkt;
        if (state.rk.selected.has(id)) state.rk.selected.delete(id);
        else state.rk.selected.add(id);
        renderStage();
      }));
      felt.querySelectorAll('[data-reclaim]').forEach(el => el.addEventListener('click', () => {
        const [grp] = state.rk.table.splice(Number(el.dataset.reclaim), 1);
        if (grp) state.rk.hand.push(...grp);
        renderStage();
      }));
      document.getElementById('btnRkPlay').addEventListener('click', () => {
        state.rk.table.push(chosen);
        state.rk.hand = state.rk.hand.filter(t => !state.rk.selected.has(t.id));
        state.rk.selected.clear();
        state.rk.opened30 = true;
        state.rk.turnSnapshot = { hand: [...state.rk.hand], table: state.rk.table.map(g => [...g]) };
        const pts = check.pts + (state.rk.hand.length === 0 ? 100 : 0);
        addScore(me.id, pts);
        triggerFx(state.rk.hand.length === 0 ? '🏆 루미큐브 완주 승리! +100' : `🧩 등록 성공! +${check.pts} PTS`);
        addLog(`🧩 ${me.name}: 타일 ${chosen.length}장 등록 (+${pts}점)`, 'win');
        renderStage();
      });
      document.getElementById('btnRkDraw').addEventListener('click', () => {
        if (state.rk.bag.length) state.rk.hand.push(state.rk.bag.pop());
        state.rk.selected.clear();
        state.rk.turnSnapshot = { hand: [...state.rk.hand], table: state.rk.table.map(g => [...g]) };
        renderStage();
      });
      document.getElementById('btnRkResetTurn').addEventListener('click', () => {
        if (state.rk.turnSnapshot) {
          state.rk.hand = [...state.rk.turnSnapshot.hand];
          state.rk.table = state.rk.turnSnapshot.table.map(g => [...g]);
          state.rk.selected.clear();
          renderStage();
        }
      });
      return;
    }

    /* 4. 고스톱 */
    if (state.mode === 'gostop') {
      const myStat = calcGostopScore(state.gs.myCap);
      const oppStat = calcGostopScore(state.gs.oppCap);
      titleEl.textContent = `🃏 고스톱 — 현재 ${myStat.pts}점 (${state.gs.goCount}고)`;
      metaEl.textContent = `광 ${myStat.gwangCnt} · 피 ${myStat.piCount}장`;
      guideEl.innerHTML = `<b>고스톱 규칙:</b> 내 패와 같은 월(노란 테두리)을 눌러 획득하세요! <b>3점 이상</b> 달성 시 <b>고 / 스톱</b> 선택과 광박·피박 배수가 적용됩니다.`;

      const handMonths = new Set(state.gs.hand.map(c => c.month));
      const renderCard = (c, clickable = false, highlight = false) => `
        <div class="hwatu ${c.type === 'gwang' ? 'gwang' : c.type === 'tti' ? 'tti' : ''} ${highlight ? 'highlight' : ''}" ${clickable ? `data-gs="${c.id}"` : ''}>
          <span style="font-size:0.68rem;font-weight:900;align-self:flex-start;">${c.month}월</span>
          <span style="font-size:1.45rem;">${c.art}</span>
          <span style="font-size:0.66rem;font-weight:900;text-align:center;">${c.name}</span>
        </div>
      `;

      felt.innerHTML = `
        <div class="gs-wrap">
          <div class="gs-felt">
            <div style="display:flex;justify-content:space-between;font-size:0.78rem;font-weight:800;color:#bbf7d0;">
              <span>🃏 바닥패 (${state.gs.floor.length}장)</span>
              <span>먹은 패 ${state.gs.myCap.length}장 (${myStat.pts}점)</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:96px;">
              ${state.gs.floor.map(c => renderCard(c, false, handMonths.has(c.month))).join('')}
            </div>
          </div>

          ${state.gs.awaitingGoStop ? `
            <div style="display:flex;gap:10px;justify-content:center;padding:10px;background:#1e1b4b;border:2px solid #fbbf24;border-radius:14px;">
              <button id="btnGsGo" class="danger" style="padding:10px 22px;font-size:1rem;">🔥 고 (GO!)</button>
              <button id="btnGsStop" class="success" style="padding:10px 22px;font-size:1rem;">🛑 스톱 (STOP!)</button>
            </div>
          ` : ''}

          <div style="background:#0b1324;border:1px solid var(--border);border-radius:14px;padding:10px;">
            <div style="font-size:0.78rem;font-weight:800;color:#fde68a;margin-bottom:6px;">✋ 내 손패 (${state.gs.hand.length}장) — 노란 빛나는 바닥패와 매칭됩니다</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
              ${state.gs.hand.map(c => renderCard(c, true, false)).join('')}
            </div>
          </div>
        </div>
      `;

      if (state.gs.awaitingGoStop) {
        document.getElementById('btnGsGo').addEventListener('click', () => {
          state.gs.goCount += 1;
          state.gs.awaitingGoStop = false;
          triggerFx(`🔥 ${state.gs.goCount}고 선언!!`);
          addLog(`🔥 ${me.name}: ${state.gs.goCount}고를 외쳤습니다!`, 'win');
          renderStage();
        });
        document.getElementById('btnGsStop').addEventListener('click', () => {
          let total = myStat.pts + state.gs.goCount;
          let mult = 1;
          if (myStat.gwangCnt >= 3 && oppStat.gwangCnt === 0) mult *= 2;
          if (myStat.piCount >= 10 && oppStat.piCount < 5) mult *= 2;
          if (state.gs.goCount >= 3) mult *= 2;
          const finalPts = total * mult * 10;
          addScore(me.id, finalPts);
          triggerFx(`🛑 스톱! ${mult > 1 ? `박 ${mult}배 ` : ''}+${finalPts} PTS!`);
          addLog(`🛑 ${me.name}: 스톱 승리! 최종 +${finalPts}점 정산!`, 'win');
          initBoardGames();
          renderStage();
        });
      }

      felt.querySelectorAll('[data-gs]').forEach(el => el.addEventListener('click', () => {
        if (state.gs.awaitingGoStop) return;
        const idx = state.gs.hand.findIndex(c => c.id === el.dataset.gs);
        if (idx === -1) return;
        const [card] = state.gs.hand.splice(idx, 1);
        const fIdx = state.gs.floor.findIndex(f => f.month === card.month);
        if (fIdx !== -1) {
          const [matched] = state.gs.floor.splice(fIdx, 1);
          state.gs.myCap.push(card, matched);
          addLog(`🃏 ${card.month}월 매칭 성공! [${card.name}] + [${matched.name}]`, 'win');
        } else {
          state.gs.floor.push(card);
        }
        // 덱에서 한 장 뒤집기
        if (state.gs.deck.length) {
          const flip = state.gs.deck.pop();
          const f2 = state.gs.floor.findIndex(f => f.month === flip.month);
          if (f2 !== -1) {
            const [m2] = state.gs.floor.splice(f2, 1);
            state.gs.myCap.push(flip, m2);
          } else {
            state.gs.floor.push(flip);
          }
        }
        const after = calcGostopScore(state.gs.myCap);
        if (after.pts >= 3 && after.pts > state.gs.lastPoints) {
          state.gs.lastPoints = after.pts;
          state.gs.awaitingGoStop = true;
        }
        renderStage();
      }));
      return;
    }

    /* 5. 끝말잇기 */
    if (state.mode === 'wordchain') {
      const lastChar = state.lastWord[state.lastWord.length - 1];
      titleEl.textContent = `🔗 끝말잇기 — 사전 ${CHAIN_DICT.length}단어 수록`;
      metaEl.textContent = `필수 첫글자: "${lastChar}"`;
      guideEl.innerHTML = `<b>끝말잇기 규칙:</b> 제시어 끝글자 <b>"${lastChar}"</b>(으)로 시작하는 2글자 이상 단어를 제출하세요! (+20점)`;

      felt.innerHTML = `
        <div class="quiz-box">
          <div class="quiz-main">${state.lastWord} ➔ [ ${lastChar} ○○ ]</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">
            ${state.usedWords.slice(-12).map(w => `<span style="background:#132342;border:1px solid var(--border);padding:3px 9px;border-radius:999px;font-size:0.78rem;color:#93c5fd;">${w}</span>`).join('')}
          </div>
        </div>
      `;
      return;
    }

    /* 6. 5종 퀴즈 (초성·속담·이모지·연상·네글자) */
    const pool = getPool();
    const q = pool[state.qIndex % pool.length];
    const mInfo = MODES.find(m => m.id === state.mode);
    titleEl.textContent = `${mInfo?.label || '퀴즈'} (${pool.length}문항 수록)`;
    metaEl.textContent = `${(state.qIndex % pool.length) + 1} / ${pool.length}번`;
    guideEl.innerHTML = `<b>퀴즈 규칙:</b> 정답 입력창에 답을 입력하면 가장 먼저 맞힌 참가자가 <b>+25점</b>을 획득합니다!`;

    felt.innerHTML = `
      <div class="quiz-box">
        <div style="display:flex;gap:8px;justify-content:center;">
          <span style="background:#1d4ed8;padding:4px 12px;border-radius:999px;font-size:0.78rem;font-weight:800;">${mInfo?.label}</span>
          <span style="background:rgba(245,158,11,0.2);color:#fcd34d;border:1px solid rgba(251,191,36,0.4);padding:4px 10px;border-radius:999px;font-size:0.78rem;font-weight:800;">난이도: ${q.diff?.toUpperCase()}</span>
        </div>
        <div class="quiz-main">${q.c || q.q || q.e || (q.clues ? q.clues.join(' · ') : '')}</div>
        <div style="font-size:0.95rem;color:#cbd5e1;">💡 힌트: ${q.hint || '정답을 맞혀보세요!'}</div>
      </div>
    `;
  }

  function renderAll() {
    renderModeRibbon();
    renderCharPickers();
    renderPlayers();
    renderSeats();
    renderStage();
  }

  /* ================= 정답 & 채팅 제출 공통 처리 ================= */
  function handleAnswerSubmit(rawText) {
    const txt = rawText.trim();
    if (!txt) return;
    const me = getMe();

    if (state.mode === 'liar') {
      if (state.liar.phase === 'guess') {
        if (normText(txt) === normText(state.liar.citizenWord)) {
          addScore(me.id, 50);
          triggerFx(`🕵️ 라이어 역전승! "${state.liar.citizenWord}" (+50)`);
          addLog(`🔥 ${me.name}님이 제시어 "${state.liar.citizenWord}"를 맞혀 역전승했습니다! (+50점)`, 'win');
          startLiarRound();
          renderAll();
        } else {
          addLog(`❌ 제시어 추측 오답: "${txt}"`, 'danger');
        }
        return;
      }
      state.liar.clues.push({ name: `${me.char} ${me.name}`, text: txt });
      state.turnIndex = (state.turnIndex + 1) % state.players.length;
      addLog(`🕵️ [한 줄 설명] ${me.char} ${me.name}: ${txt}`, 'sys');
      renderAll();
      return;
    }

    if (state.mode === 'wordchain') {
      const expected = state.lastWord[state.lastWord.length - 1];
      const clean = txt.replace(/\s+/g, '');
      if (clean.length < 2 || clean[0] !== expected) {
        addLog(`❌ "${expected}"(으)로 시작하는 2글자 이상 단어를 입력하세요!`, 'danger', false);
        return;
      }
      if (state.usedWords.includes(clean)) {
        addLog(`❌ "${clean}"은(는) 이미 사용한 단어입니다!`, 'danger', false);
        return;
      }
      state.lastWord = clean;
      state.usedWords.push(clean);
      addScore(me.id, 20);
      triggerFx(`🔗 "${clean}" 성공! +20 PTS`, false);
      addLog(`🔗 ${me.char} ${me.name}: "${clean}" (+20점)`, 'win');
      sendNet({ type: 'sync_round', mode: state.mode, difficulty: state.difficulty, qIndex: state.qIndex, lastWord: state.lastWord, usedWords: state.usedWords });
      renderStage();

      // 봇 이어말하기 대응
      const bots = state.players.filter(p => p.isBot);
      if (bots.length) {
        const nextFirst = clean[clean.length - 1];
        const cand = CHAIN_DICT.filter(w => w[0] === nextFirst && !state.usedWords.includes(w));
        if (cand.length) {
          setTimeout(() => {
            const pick = cand[Math.floor(Math.random() * cand.length)];
            const bot = bots[Math.floor(Math.random() * bots.length)];
            state.lastWord = pick;
            state.usedWords.push(pick);
            addScore(bot.id, 15);
            addLog(`🤖 ${bot.name}: "${pick}" (+15점)`, 'win');
            renderStage();
          }, 800);
        }
      }
      return;
    }

    const pool = getPool();
    const q = pool[state.qIndex % pool.length];
    addLog(`🎯 ${me.char} ${me.name}: ${txt}`);
    if (q && normText(txt) === normText(q.a)) {
      addScore(me.id, 25);
      triggerFx(`🎉 정답! "${q.a}" +25 PTS`);
      addLog(`🎉 [${me.name}] 정답! "${q.a}" (+25점)`, 'win');
      state.qIndex++;
      sendNet({ type: 'sync_round', mode: state.mode, difficulty: state.difficulty, qIndex: state.qIndex });
      renderStage();
    } else {
      addLog(`💨 아쉽지만 오답입니다!`, 'danger', false);
    }
  }

  /* ================= 이벤트 리스너 등록 ================= */
  document.getElementById('answerForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('answerInput');
    handleAnswerSubmit(inp.value);
    inp.value = '';
  });
  document.getElementById('mobileAnswerForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('mobileAnswerInput');
    handleAnswerSubmit(inp.value);
    inp.value = '';
  });

  const handleChat = (inpId) => {
    const inp = document.getElementById(inpId);
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    const me = getMe();
    addLog(`${me.char} ${me.name}: ${txt}`);
  };
  document.getElementById('chatForm').addEventListener('submit', e => { e.preventDefault(); handleChat('chatInput'); });
  document.getElementById('mobileChatForm').addEventListener('submit', e => { e.preventDefault(); handleChat('mobileChatInput'); });

  document.querySelectorAll('[data-react]').forEach(btn => {
    btn.addEventListener('click', () => {
      const emoji = btn.dataset.react;
      showSeatBubble(myId, emoji);
      sendNet({ type: 'react', playerId: myId, emoji });
    });
  });

  document.getElementById('btnSaveProfile').addEventListener('click', () => {
    const me = getMe();
    const nick = document.getElementById('nicknameInput').value.trim();
    if (nick) me.name = nick;
    renderAll();
    sendNet({ type: 'sync_players', players: state.players });
    addLog(`🎭 프로필이 [${me.char} ${me.name}](으)로 변경되었습니다.`, 'sys');
  });

  document.getElementById('diffSelect').addEventListener('change', e => {
    state.difficulty = e.target.value;
    state.qIndex = 0;
    renderAll();
    sendNet({ type: 'sync_round', mode: state.mode, difficulty: state.difficulty, qIndex: state.qIndex });
  });

  document.getElementById('btnStart').addEventListener('click', () => {
    state.qIndex = 0;
    if (state.mode === 'liar') startLiarRound();
    else initBoardGames();
    triggerFx('▶ 새 라운드 시작!', false);
    addLog(`▶ 새 라운드를 시작했습니다!`, 'sys');
    renderAll();
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    if (state.mode === 'liar') {
      startLiarRound();
    } else if (state.mode === 'wordchain') {
      const w = CHAIN_DICT[Math.floor(Math.random() * CHAIN_DICT.length)];
      state.lastWord = w;
      state.usedWords.push(w);
    } else if (!['yut', 'rummikub', 'gostop'].includes(state.mode)) {
      const pool = getPool();
      if (pool.length) addLog(`💡 정답 공개: "${pool[state.qIndex % pool.length].a}"`, 'sys');
      state.qIndex++;
    } else {
      initBoardGames();
    }
    renderAll();
    sendNet({ type: 'sync_round', mode: state.mode, difficulty: state.difficulty, qIndex: state.qIndex, lastWord: state.lastWord, usedWords: state.usedWords, liar: state.liar });
  });

  document.getElementById('btnToggleBots').addEventListener('click', () => {
    const hasBots = state.players.some(p => p.isBot);
    if (!hasBots) {
      const bots = [
        { id: 'bot_1', name: '여우봇', char: '🦊', isBot: true, score: 0, bubble: '' },
        { id: 'bot_2', name: '판다봇', char: '🐼', isBot: true, score: 0, bubble: '' },
        { id: 'bot_3', name: '문어봇', char: '🐙', isBot: true, score: 0, bubble: '' }
      ];
      const avail = Math.max(0, state.maxPlayers - state.players.length);
      state.players.push(...bots.slice(0, avail));
    } else {
      state.players = state.players.filter(p => !p.isBot);
    }
    renderAll();
  });

  document.getElementById('btnToggleLock').addEventListener('click', () => {
    state.locked = !state.locked;
    renderPlayers();
  });

  document.getElementById('btnOpenCreateRoom').addEventListener('click', () => {
    modalChar = getMe().char;
    renderCharPickers();
    document.getElementById('createRoomModal').classList.add('open');
  });
  document.getElementById('btnCancelCreateRoom').addEventListener('click', () => {
    document.getElementById('createRoomModal').classList.remove('open');
  });
  document.getElementById('btnConfirmCreateRoom').addEventListener('click', () => {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    getMe().char = modalChar;
    state.roomTitle = document.getElementById('newRoomTitle').value.trim() || '10인 파티룸';
    state.maxPlayers = Number(document.getElementById('newRoomMax').value) || 10;
    state.roomCode = code;
    state.hostId = myId;
    document.getElementById('createRoomModal').classList.remove('open');
    connectRoomNetwork(false);
    renderAll();
    triggerFx(`🏠 방 생성 완료! #${code}`, false);
    addLog(`🏠 새 방 [${state.roomTitle}] (초대코드: ${code}) 생성!`, 'win', false);
  });

  document.getElementById('btnCopyCode').addEventListener('click', () => {
    navigator.clipboard?.writeText(state.roomCode).catch(() => {});
    triggerFx(`📋 코드 복사: ${state.roomCode}`, false);
  });
  document.getElementById('btnCopyLink').addEventListener('click', () => {
    const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(state.roomCode)}`;
    navigator.clipboard?.writeText(url).catch(() => {});
    triggerFx('🔗 초대 링크 복사 완료!', false);
  });
  document.getElementById('btnJoinByCode').addEventListener('click', () => {
    const code = document.getElementById('inviteCodeInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    state.roomCode = code;
    connectRoomNetwork(true);
    renderAll();
    addLog(`🎟️ [#${code}] 방에 입장을 시도합니다...`, 'sys', false);
  });
  document.getElementById('btnClearChat').addEventListener('click', () => {
    document.getElementById('chatLog').innerHTML = '';
  });

  /* 초기화 실행 */
  initBoardGames();
  startLiarRound();
  connectRoomNetwork(Boolean(urlRoom && urlRoom !== 'PARTY1'));
  renderAll();
  addLog('🎮 10인 파티 허브 v4.0 준비 완료! 상단 탭에서 10종 게임을 전환해 보세요.', 'sys', false);
})();
</script>
</body>
</html>
