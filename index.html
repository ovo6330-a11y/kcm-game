<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KCM 파티 아케이드 — 멀티플레이 & 무인도 · 고스톱</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #0b1120;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --purple: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: radial-gradient(circle at top, #172554 0%, var(--bg) 52%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .app {
    max-width: 1140px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header.topbar {
    background: rgba(30, 41, 59, 0.92);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand h1 {
    margin: 0;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .conn-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 0.84rem;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--warn);
  }
  .dot.ok { background: var(--accent-2); }
  .dot.err { background: var(--danger); }

  .card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
  }
  input, select, button {
    font-family: inherit;
    font-size: 0.92rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 9px 12px;
    color: var(--text);
    background: var(--panel-2);
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    border-color: var(--accent);
  }
  button {
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #0284c7; border-color: #0ea5e9; }
  .btn-green { background: #15803d; border-color: #22c55e; }
  .btn-amber { background: #b45309; border-color: #f59e0b; }
  .btn-purple { background: #7e22ce; border-color: #a855f7; }
  .btn-danger { background: #b91c1c; border-color: #ef4444; }
  .btn-ghost { background: var(--panel-2); border-color: var(--border); }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .mode-btn {
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .mode-btn.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
    background: #0c2742;
  }
  .mode-btn small { color: var(--muted); font-size: 0.75rem; font-weight: 400; }

  .players-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .player-chip {
    padding: 7px 12px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .player-chip.turn {
    border-color: var(--warn);
    box-shadow: 0 0 0 1px var(--warn);
    background: #2c1f07;
  }

  .hud-strip {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .timer-pill {
    padding: 5px 11px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    background: #172554;
    border: 1px solid #3b82f6;
  }
  .timer-pill.urgent {
    background: #450a0a;
    border-color: var(--danger);
    color: #fca5a5;
  }

  .liar-arena {
    position: relative;
    width: 100%;
    max-width: 560px;
    height: 360px;
    margin: 12px auto;
    border-radius: 24px;
    background: radial-gradient(circle at center, #132844 0%, #091324 100%);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .liar-center-table {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #334155, #1e293b 70%, #0f172a);
    border: 3px solid #64748b;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55), inset 0 0 18px rgba(56, 189, 248, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    z-index: 2;
  }
  .liar-center-table small { font-size: 0.72rem; color: var(--muted); }
  .liar-center-table strong { font-size: 0.95rem; color: #38bdf8; margin-top: 3px; }
  .liar-seat {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 112px;
    padding: 7px 8px;
    border-radius: 14px;
    background: #1e293b;
    border: 2px solid #475569;
    text-align: center;
    font-size: 0.78rem;
    z-index: 3;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
  }
  .liar-seat.speaking {
    border-color: #facc15;
    background: #2f2306;
    box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.28);
  }
  .liar-seat.votable { cursor: pointer; border-color: #38bdf8; }
  .liar-seat.selected-vote {
    border-color: #f97316;
    background: #3b1708;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.35);
  }
  .liar-chair-icon { font-size: 1.05rem; line-height: 1.1; }
  .liar-seat-name {
    font-weight: 700;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .liar-speech-bubble {
    margin-top: 4px;
    padding: 3px 6px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #fde047;
    font-size: 0.72rem;
    word-break: break-all;
  }

  .log-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    height: 150px;
    overflow-y: auto;
    font-size: 0.85rem;
    line-height: 1.45;
  }
  .log-line { margin-bottom: 4px; }
  .log-line span.time { color: var(--muted); font-size: 0.76rem; margin-right: 6px; }

  canvas.draw-canvas {
    width: 100%;
    max-width: 640px;
    height: 310px;
    background: #ffffff;
    border-radius: 12px;
    border: 2px solid var(--border);
    touch-action: none;
    display: block;
  }
  .palette-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 8px 0;
  }
  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    padding: 0;
  }
  .swatch.selected {
    transform: scale(1.16);
    border-color: #ffffff;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .island-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .stat-box strong { display: block; font-size: 1.15rem; margin-top: 3px; color: #7dd3fc; }

  .stage-overlay {
    margin-top: 12px;
    background: #081224;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 14px;
  }
  .stage-banner {
    padding: 8px 12px;
    border-radius: 8px;
    background: #172554;
    border: 1px solid #38bdf8;
    font-size: 0.88rem;
    margin-bottom: 10px;
  }
  .chop-track {
    position: relative;
    height: 36px;
    background: #1e293b;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin: 12px 0;
  }
  .crit-zone {
    position: absolute;
    top: 0; bottom: 0;
    left: 38%; width: 24%;
    background: rgba(34, 197, 94, 0.35);
    border-left: 2px solid #4ade80;
    border-right: 2px solid #4ade80;
  }
  .strike-cursor {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 10px;
    background: #facc15;
    border-radius: 4px;
    box-shadow: 0 0 10px #facc15;
  }
  .coconut-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 12px 0;
  }
  .coconut-slot {
    height: 82px;
    border-radius: 12px;
    background: #132238;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    cursor: pointer;
    user-select: none;
  }
  .coconut-slot small { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

  .opponents-gostop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .opponent-gostop-box {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid #475569;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .opponent-gostop-box.active-turn {
    border-color: #facc15;
    box-shadow: 0 0 0 1px #facc15;
  }
  .opponent-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.84rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .face-down-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }
  .hwatu-back-card {
    width: 24px;
    height: 36px;
    border-radius: 5px;
    background: repeating-linear-gradient(
      45deg,
      #991b1b,
      #991b1b 4px,
      #7f1d1d 4px,
      #7f1d1d 8px
    );
    border: 1.5px solid #fca5a5;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
  }

  .gostop-felt-board {
    background: radial-gradient(circle at center, #14532d 0%, #052e16 100%);
    border: 2px solid #22c55e;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.45);
  }
  .gostop-board-title {
    font-size: 0.84rem;
    font-weight: 700;
    color: #bbf7d0;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stock-pill {
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid #86efac;
    color: #fef08a;
    font-size: 0.76rem;
  }
  .hwatu-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 8px 0;
    align-items: flex-end;
  }
  .hwatu-svg-card {
    width: 92px;
    border-radius: 12px;
    background: #fffbeb;
    border: 2px solid #92400e;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    padding: 5px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    position: relative;
  }
  .hwatu-svg-card.floor-card {
    width: 84px;
    cursor: default;
  }
  .hwatu-svg-card.floor-match {
    border-color: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.55), 0 8px 18px rgba(0, 0, 0, 0.45);
    transform: translateY(-4px);
  }
  .hwatu-svg-card.playable:hover {
    transform: translateY(-6px);
    border-color: #facc15;
    box-shadow: 0 10px 20px rgba(250, 204, 21, 0.25);
  }
  .hwatu-svg-card.tier-광 { border-color: #dc2626; background: linear-gradient(180deg, #fffbeb 0%, #fef2f2 100%); }
  .hwatu-svg-card.tier-열끗 { border-color: #7e22ce; background: linear-gradient(180deg, #fffbeb 0%, #faf5ff 100%); }
  .hwatu-svg-card.tier-띠 { border-color: #0284c7; background: linear-gradient(180deg, #fffbeb 0%, #f0f9ff 100%); }
  .hwatu-svg-card.tier-피 { border-color: #475569; background: linear-gradient(180deg, #fffbeb 0%, #f8fafc 100%); }
  .hwatu-svg-card svg {
    width: 100%;
    height: 112px;
    display: block;
    border-radius: 8px;
  }
  .hwatu-svg-card.floor-card svg { height: 100px; }
  .hwatu-footer {
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    font-size: 0.72rem;
    color: #1e293b;
    font-weight: 700;
  }
  .hwatu-tier-tag {
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 0.66rem;
    font-weight: 800;
  }
  .tier-tag-광 { background: #fee2e2; color: #b91c1c; }
  .tier-tag-열끗 { background: #f3e8ff; color: #6b21a8; }
  .tier-tag-띠 { background: #e0f2fe; color: #0369a1; }
  .tier-tag-피 { background: #e2e8f0; color: #334155; }

  .captured-mini-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 4px;
  }
  .captured-mini-card {
    width: 48px;
    background: #fffbeb;
    border: 1.5px solid #78350f;
    border-radius: 7px;
    padding: 2px;
    text-align: center;
  }
  .captured-mini-card svg {
    width: 100%;
    height: 56px;
    display: block;
    border-radius: 4px;
  }
  .captured-mini-card span {
    display: block;
    font-size: 0.6rem;
    font-weight: 700;
    color: #1e293b;
    margin-top: 1px;
  }

  .card-flip-board {
    display: grid;
    gap: 6px;
    margin: 10px 0;
    max-width: 100%;
  }
  .card-flip-board.size-4 {
    grid-template-columns: repeat(4, minmax(60px, 1fr));
    max-width: 340px;
  }
  .card-flip-board.size-8 {
    grid-template-columns: repeat(8, minmax(36px, 1fr));
    max-width: 560px;
    gap: 5px;
  }
  .card-flip-board.size-16 {
    grid-template-columns: repeat(16, minmax(22px, 1fr));
    max-width: 820px;
    gap: 3px;
  }
  .flip-btn {
    padding: 2px;
    border-radius: 8px;
    height: 60px;
    font-size: 1.45rem;
    background: #1e3a8a;
    border: 1px solid #60a5fa;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-flip-board.size-8 .flip-btn { height: 44px; font-size: 1.05rem; border-radius: 6px; }
  .card-flip-board.size-16 .flip-btn { height: 30px; font-size: 0.78rem; border-radius: 4px; padding: 0; }
  .flip-btn.revealed { background: #0f172a; border-color: #22c55e; }
  .flip-btn.matched { background: #052e16; border-color: #4ade80; opacity: 0.85; }

  .nunchi-board {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }
  .nunchi-badge {
    padding: 8px 14px;
    border-radius: 12px;
    background: #0b1120;
    border: 1px solid #38bdf8;
    font-weight: 700;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 18px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>🎮 KCM 파티 아케이드</h1>
      <p>12가지 미니게임 · 대확장 랜덤 퀴즈 풀 · 상대패 공개 SVG 고스톱</p>
    </div>
    <div class="conn-badge">
      <span id="connDot" class="dot"></span>
      <span id="connText">대기 중</span>
    </div>
  </header>

  <section id="lobbyCard" class="card">
    <div class="row" style="justify-content: space-between;">
      <div class="row">
        <input id="nickInput" type="text" placeholder="닉네임 입력" maxlength="12" value="플레이어1" style="width:140px;" />
        <button id="btnCreateRoom" class="btn-primary">새 방 만들기</button>
        <input id="roomCodeInput" type="text" placeholder="방 코드 (예: KCM123)" maxlength="10" style="width:150px; text-transform:uppercase;" />
        <button id="btnJoinRoom" class="btn-green">코드로 방 참여</button>
      </div>
      <div class="row">
        <button id="btnSoloIsland" class="btn-amber">🏝️ 방 참여 없이 무인도 혼자 입장하기</button>
        <button id="btnLeaveRoom" class="btn-ghost hidden">방 나가기</button>
      </div>
    </div>

    <div id="roomInfoBar" class="row hidden" style="margin-top:12px; justify-content:space-between; background:#0b1120; padding:10px 12px; border-radius:10px; border:1px solid var(--border);">
      <div class="row">
        <strong>방 코드: <span id="activeRoomCode" style="color:#38bdf8; letter-spacing:1px;">-</span></strong>
        <button id="btnCopyRoom" class="btn-ghost" style="padding:5px 10px; font-size:0.8rem;">코드 복사</button>
        <span id="hostBadge" style="font-size:0.82rem; color:#fde047;"></span>
      </div>
      <div class="row">
        <button id="btnAddBot" class="btn-ghost" style="padding:5px 10px; font-size:0.8rem;">+ AI 봇 추가</button>
        <button id="btnOpenRanking" class="btn-purple" style="padding:5px 10px; font-size:0.8rem;">🏆 순위표</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <div class="row" style="justify-content:space-between;">
        <span style="font-size:0.88rem; font-weight:700;">게임 모드 선택 <span id="hostLockNote" style="color:var(--warn); font-weight:500;"></span></span>
        <button id="btnStartGame" class="btn-green">▶ 게임 시작</button>
      </div>
      <div id="modeGrid" class="mode-grid"></div>
    </div>
  </section>

  <section id="roomStage" class="card hidden">
    <div class="row" style="justify-content:space-between; margin-bottom:10px;">
      <div id="playersBar" class="players-bar"></div>
      <div class="row">
        <span style="font-size:0.85rem; color:var(--muted);">공용 자금:</span>
        <strong id="sharedMoneyLabel" style="color:#4ade80;">10,000원</strong>
      </div>
    </div>

    <div id="gameViewport"></div>

    <div class="grid-2" style="margin-top:14px;">
      <div>
        <div style="font-size:0.85rem; font-weight:700; margin-bottom:6px;">💬 실시간 채팅 & 판 진행 로그</div>
        <div id="logBox" class="log-box"></div>
        <div class="row" style="margin-top:8px;">
          <input id="chatInput" type="text" placeholder="메시지 또는 정답 입력..." style="flex:1;" />
          <button id="btnSendChat" class="btn-primary">전송</button>
        </div>
      </div>

    { cat: '동물', word: '코알라' },
    { cat: '동물', word: '돌고래' },
    { cat: '장소', word: '한강공원' },
    { cat: '장소', word: '노래방' },
    { cat: '장소', word: '도서관' },
    { cat: '장소', word: '놀이공원' },

    { cat: '물건', word: '우산' },
    { cat: '물건', word: '이어폰' },

    { cat: '물건', word: '백팩' },

  const state = {
    myId: 'u_' + Math.random().toString(36).slice(2, 8),
    myName: '플레이어1',
    roomCode: '',
    isHost: true,
    soloIsland: false,

    sharedMoney: GAME_CONFIG.defaultMoney,

    wordchain: { used: [], lastWord: '', combo: 0 },
    hunmin: { prompt: 'ㄱㅅ', used: [] },
    catchmind: { drawerId: '', prompt: CATCHMIND_PROMPTS[0], strokes: [], guessed: false },
    cardflip: { size: 4, cards: [], flipped: [], matched: [] },
    emojiquiz: { index: 0, solved: false },
    liar: { topic: LIAR_TOPICS[0], liarId: '', phase: 'hint', hints: {}, votes: {}, revealed: false },
    chosung: { index: 0, solved: false },

    wordassoc: { index: 0, solved: false },

    },

      shaken: {},
      bankruptCount: {}
    }
  };

  let peer = null;
  const conns = new Map();
  let tickTimer = null;
  let hoveredHandMonth = null;

  const miniLocal = {
    fish: { bite: false, reel: 0, caughtCount: 0, msg: '찌를 던지고 입질(!)이 오면 위로 드래그하거나 당기세요!' },
    wood: { pos: 10, dir: 1, choppedCount: 0, critCount: 0, msg: '노란 바가 초록 크리티컬 존에 올 때 클릭 또는 Space!' },
    coconut: { slots: [], harvestedCount: 0, msg: '잘 익은 코코넛(🥥, 🥥✨)을 누르고 벌레(🐛)는 피하세요!' },
    dragStartY: null
  };

  const brush = {
    color: '#0f172a',
    size: 4,
    eraser: false,
    drawing: false,
    currentStroke: null
  };

  const $ = (id) => document.getElementById(id);

  function nowStr() {
    const d = new Date();
    return d.toTimeString().slice(0, 8);
  }

  function addLog(text) {
    state.logs.push({ t: nowStr(), text });
    if (state.logs.length > 80) state.logs.shift();
    renderLogs();
  }

  function setConnStatus(status, label) {
    const dot = $('connDot');
    dot.className = 'dot ' + (status === 'ok' ? 'ok' : status === 'err' ? 'err' : '');
    $('connText').textContent = label;
  }

  function ensurePlayer(id, name, isBot = false) {
    if (!state.players.some(p => p.id === id)) {
      state.players.push({ id, name, isBot });
    } else {
      const p = state.players.find(x => x.id === id);
      if (name) p.name = name;
    }
    if (typeof state.scores[id] !== 'number') state.scores[id] = 0;
    if (typeof state.gostop.bankruptCount[id] !== 'number') state.gostop.bankruptCount[id] = 0;
  }

  function getCurrentTurnPlayer() {
    if (!state.players.length) return null;
    return state.players[state.turnIndex % state.players.length];
  }

  function isMyTurn() {
    const cur = getCurrentTurnPlayer();
    return cur && cur.id === state.myId;
  }

  function getTurnSecondsForCurrentState() {
    if (state.mode === 'cardflip') {
      return GAME_CONFIG.cardFlipSeconds[state.cardflip.size] || 35;
    }
    return GAME_CONFIG.turnSeconds[state.mode] || 20;
  }

  function broadcast(payload) {
    const raw = JSON.stringify(payload);
    conns.forEach((c) => {
      if (c && c.open) c.send(raw);
    });
  }

  function syncStateToPeers() {
    if (!state.isHost) return;
    broadcast({ type: 'SYNC_STATE', state });
  }

  function handleIncomingData(fromId, raw) {
    let msg;
    try {
      msg = typeof raw === 'string' ? JSON.parse(raw) : raw;
    } catch { return; }

    if (msg.type === 'SYNC_STATE') {
      const keepMini = state.island.miniStage;
      const prevStrokesLen = state.catchmind.strokes.length;
      Object.assign(state, msg.state);
      if (keepMini) state.island.miniStage = keepMini;
      renderAll();
      if (state.mode === 'catchmind' && state.catchmind.strokes.length !== prevStrokesLen) {
        redrawCatchmindCanvas();
      }
      return;
    }

    if (msg.type === 'CHAT') {
      addLog(`[${msg.sender}] ${msg.text}`);
      if (state.isHost && state.activeGame) {
        evaluateChatAnswer(msg.senderId, msg.sender, msg.text);
      }
      return;
    }

    if (msg.type === 'DRAW_STROKE') {
      state.catchmind.strokes.push(msg.stroke);
      if (state.mode === 'catchmind') appendStrokeToCanvas(msg.stroke);
      if (state.isHost) broadcast(msg);
      return;
    }

    if (msg.type === 'CLEAR_CANVAS') {
      state.catchmind.strokes = [];
      if (state.mode === 'catchmind') redrawCatchmindCanvas();
      if (state.isHost) broadcast(msg);
      return;
    }

    if (!state.isHost) return;

    if (msg.type === 'HELLO') {
      ensurePlayer(msg.playerId, msg.playerName, false);
      addLog(`👋 ${msg.playerName} 님이 입장했습니다.`);
      syncStateToPeers();
      renderAll();
    } else if (msg.type === 'ACTION_WORDCHAIN') {
      handleWordchainSubmit(msg.playerId, msg.word);
    } else if (msg.type === 'ACTION_HUNMIN') {
      handleHunminSubmit(msg.playerId, msg.word);
    } else if (msg.type === 'ACTION_CARDFLIP') {
      handleCardFlip(msg.playerId, msg.index);
    } else if (msg.type === 'ACTION_CARDFLIP_SIZE') {
      handleCardFlipSizeChange(msg.playerId, msg.size);
    } else if (msg.type === 'ACTION_NUNCHI') {
      handleNunchiCall(msg.playerId, msg.num);
    } else if (msg.type === 'ACTION_LIAR_HINT') {
      state.liar.hints[msg.playerId] = msg.hint;
      addLog(`🕵️ ${getPlayerName(msg.playerId)} 힌트: "${msg.hint}"`);
      advanceTurn();
    } else if (msg.type === 'ACTION_LIAR_VOTE') {
      state.liar.votes[msg.playerId] = msg.targetId;
      addLog(`🗳️ ${getPlayerName(msg.playerId)} 투표 완료`);
      if (Object.keys(state.liar.votes).length >= state.players.length) {
        resolveLiarVote();
      } else {
        syncStateToPeers();
        renderAll();
      }
    } else if (msg.type === 'ACTION_ISLAND_GATHER') {
      applyIslandGather(msg.playerId, msg.resource, msg.amount, msg.label);
    } else if (msg.type === 'ACTION_ISLAND_SELL') {
      applyIslandSell(msg.playerId);
    } else if (msg.type === 'ACTION_GOSTOP_PLAY') {
      handleGostopPlay(msg.playerId, msg.cardId);
    } else if (msg.type === 'ACTION_GOSTOP_SHAKE') {
      handleGostopShake(msg.playerId);
    } else if (msg.type === 'ACTION_GOSTOP_GO_STOP') {
      handleGostopGoStop(msg.playerId, msg.choice);
    }
  }

  function getPlayerName(id) {
    return (state.players.find(p => p.id === id) || {}).name || id;
  }

  function setupPeerAsHost(code) {
    if (peer) peer.destroy();
    state.roomCode = code;
    state.isHost = true;
    state.soloIsland = false;
    setConnStatus('', `방 개설 중 (${code})...`);
    peer = new Peer('KCM_' + code);

    peer.on('open', () => {
      setConnStatus('ok', `방장 연결됨 · ${code}`);
      ensurePlayer(state.myId, state.myName, false);
      addLog(`🏠 방 [${code}] 생성 완료! 친구에게 코드를 공유하세요.`);
      syncStateToPeers();
      renderAll();
    });

    peer.on('connection', (conn) => {
      conns.set(conn.peer, conn);
      conn.on('data', (d) => handleIncomingData(conn.peer, d));
      conn.on('close', () => conns.delete(conn.peer));
      conn.on('open', () => {
        conn.send(JSON.stringify({ type: 'SYNC_STATE', state }));
      });
    });

    peer.on('error', (err) => {
      console.warn(err);
      setConnStatus('err', `오프라인/샌드박스 모드 (${code})`);
      ensurePlayer(state.myId, state.myName, false);
      addLog(`ℹ️ 네트워크 제한으로 로컬/샌드박스 방 [${code}]으로 동작합니다.`);
      renderAll();
    });
  }

  function setupPeerAsGuest(code) {
    if (peer) peer.destroy();
    state.roomCode = code;
    state.isHost = false;
    state.soloIsland = false;
    setConnStatus('', `방 [${code}] 접속 중...`);
    peer = new Peer();

    peer.on('open', () => {
      const conn = peer.connect('KCM_' + code);
      conns.set(conn.peer, conn);
      conn.on('open', () => {
        setConnStatus('ok', `참여 중 · ${code}`);
        conn.send(JSON.stringify({ type: 'HELLO', playerId: state.myId, playerName: state.myName }));
      });
      conn.on('data', (d) => handleIncomingData(conn.peer, d));
      conn.on('close', () => setConnStatus('err', '연결 종료됨'));
    });

    peer.on('error', () => {
      setConnStatus('err', '방 연결 실패 (코드 확인 필요)');
      addLog(`⚠️ 방 [${code}] 연결에 실패했습니다. 호스트 방 코드와 주소를 확인하세요.`);
    });
  }

  function enterSoloIsland() {
    state.soloIsland = true;
    state.isHost = true;
    state.roomCode = 'SOLO';
    state.players = [{ id: state.myId, name: state.myName, isBot: false }];
    state.scores[state.myId] = state.scores[state.myId] || 0;
    state.mode = 'island';
    state.activeGame = true;
    state.island.miniStage = null;
    setConnStatus('ok', '무인도 솔로 입장');
    addLog('🏝️ 방 참여 없이 무인도에 혼자 입장했습니다! 채집·판매·고스톱 전환이 가능합니다.');
    renderAll();
  }

  function startGame() {
    if (!state.isHost && !state.soloIsland) {
      addLog('⚠️ 방장만 게임을 시작할 수 있습니다.');
      return;
    }
    ensurePlayer(state.myId, state.myName, false);
    if (state.players.length === 1 && state.mode !== 'island') {
      ensurePlayer('bot_1', '봇_알파', true);
    }
    state.activeGame = true;
    state.turnIndex = 0;
    initModeState(state.mode);
    state.timeLeft = getTurnSecondsForCurrentState();
    addLog(`🚀 [${MODES.find(m => m.id === state.mode)?.name}] 라운드 ${state.round} 시작!`);
    syncStateToPeers();
    renderAll();
  }

  function initModeState(mode) {
    if (mode === 'wordchain') {
      const starters = ['사과','바다','코끼리','하늘','기차','별빛','고양이','우주','도서관','바람','여행','음악'];
      const first = pickRandomItem(starters, state.wordchain.lastWord);
      state.wordchain = { used: [first], lastWord: first, combo: 0 };
    } else if (mode === 'hunmin') {
      const p = pickRandomItem(HUNMIN_PROMPTS, state.hunmin.prompt);
      state.hunmin = { prompt: p, used: [] };
    } else if (mode === 'catchmind') {
      const drawer = state.players[state.turnIndex % state.players.length];
      const prompt = pickRandomItem(CATCHMIND_PROMPTS, state.catchmind.prompt);
      state.catchmind = { drawerId: drawer.id, prompt, strokes: [], guessed: false };
    } else if (mode === 'cardflip') {
      const sz = [4, 8, 16].includes(state.cardflip.size) ? state.cardflip.size : 4;
      state.cardflip = { size: sz, cards: buildCardDeck(sz), flipped: [], matched: [] };
    } else if (mode === 'emojiquiz') {
      state.emojiquiz = { index: pickRandomIndex(EMOJI_POOL.length, state.emojiquiz.index), solved: false };
    } else if (mode === 'chosung') {
      state.chosung = { index: pickRandomIndex(CHOSUNG_POOL.length, state.chosung.index), solved: false };
    } else if (mode === 'nunchi') {
      state.nunchi = { currentNum: 0, calls: [] };
    } else if (mode === 'wordassoc') {
      state.wordassoc = { index: pickRandomIndex(WORDASSOC_POOL.length, state.wordassoc.index), solved: false };
    } else if (mode === 'proverb') {
      state.proverb = { index: pickRandomIndex(PROVERB_POOL.length, state.proverb.index), solved: false };
    } else if (mode === 'liar') {
      const topic = pickRandomItem(LIAR_TOPICS, state.liar.topic);
      const liar = state.players[Math.floor(Math.random() * state.players.length)];
      state.liar = { topic, liarId: liar.id, phase: 'hint', hints: {}, votes: {}, revealed: false };
    } else if (mode === 'island') {
      const weathers = ['☀️ 맑음 (채집 +1 보너스)', '🌊 잔잔한 파도 (낚시 유리)', '🌴 산들바람 (코코넛 풍년)', '🌧️ 소나기 (주의)'];
      state.island.weather = pickRandomItem(weathers, state.island.weather);
    } else if (mode === 'gostop') {
      initGostopRound();
    }
  }

  function advanceTurn(reason = '') {
    if (!state.isHost) return;
    if (reason) addLog(reason);
    state.turnIndex = (state.turnIndex + 1) % Math.max(1, state.players.length);
    state.timeLeft = getTurnSecondsForCurrentState();

    if (state.mode === 'catchmind') {
      const drawer = getCurrentTurnPlayer();
      const prompt = pickRandomItem(CATCHMIND_PROMPTS, state.catchmind.prompt);
      state.catchmind = { drawerId: drawer.id, prompt, strokes: [], guessed: false };
    } else if (state.mode === 'emojiquiz') {
      state.emojiquiz.index = pickRandomIndex(EMOJI_POOL.length, state.emojiquiz.index);
      state.emojiquiz.solved = false;
    } else if (state.mode === 'chosung') {
      state.chosung.index = pickRandomIndex(CHOSUNG_POOL.length, state.chosung.index);
      state.chosung.solved = false;
    } else if (state.mode === 'wordassoc') {
      state.wordassoc.index = pickRandomIndex(WORDASSOC_POOL.length, state.wordassoc.index);
      state.wordassoc.solved = false;
    } else if (state.mode === 'proverb') {
      state.proverb.index = pickRandomIndex(PROVERB_POOL.length, state.proverb.index);
      state.proverb.solved = false;
    } else if (state.mode === 'gostop') {
      const cur = getCurrentTurnPlayer();
      state.gostop.turnId = cur ? cur.id : state.myId;
    }

    hoveredHandMonth = null;
    syncStateToPeers();
    renderAll();

    const cur = getCurrentTurnPlayer();
    if (cur && cur.isBot && state.activeGame) {
      setTimeout(() => runBotTurn(cur.id), 900);
    }
  }

  function runBotTurn(botId) {
    if (!state.isHost || !state.activeGame) return;
    const cur = getCurrentTurnPlayer();
    if (!cur || cur.id !== botId) return;

    if (state.mode === 'wordchain') {
      const lastChar = state.wordchain.lastWord.slice(-1);
      const candidates = ['사과','과자','자전거','거울','얼음','음료','요리','리본','논밭','밭두렁','강아지','지우개','개나리','리듬','몸풀기'];
      const match = candidates.find(w => w.startsWith(lastChar) && !state.wordchain.used.includes(w));
      if (match) {
        handleWordchainSubmit(botId, match);
        return;
      }
    } else if (state.mode === 'hunmin') {
      const p = state.hunmin.prompt;
      const sampleMap = {
        'ㄱㅅ': '감사','ㅅㅋ': '스키','ㅂㅋ': '바퀴','ㅎㄹ': '한라','ㅁㅋ': '마이크','ㅊㅋ': '축하',
        'ㄴㅁ': '나무','ㅍㅈ': '편지','ㅇㄹ': '유리','ㅂㅅ': '버스','ㄷㄹ': '도로','ㄱㅁ': '고구마'
      };
      const ans = sampleMap[p] || (p[0] + '가' + p[1] + '나');
      handleHunminSubmit(botId, ans);
      return;
    } else if (state.mode === 'nunchi') {
      const nextNum = state.nunchi.currentNum + 1;
      const target = Math.max(2, state.players.length);
      if (nextNum <= target) {
        handleNunchiCall(botId, nextNum);
        return;
      }
    } else if (state.mode === 'liar') {
      if (!state.liar.hints[botId]) {
        state.liar.hints[botId] = '일상에서 자주 접하는 느낌';
        addLog(`🕵️ ${cur.name} 힌트: "${state.liar.hints[botId]}"`);
        advanceTurn();
        return;
      }
    } else if (state.mode === 'gostop') {
      const hand = state.gostop.hands[botId] || [];
      if (hand.length > 0) {
        const matchCard = hand.find(c => state.gostop.floor.some(f => f.month === c.month));
        handleGostopPlay(botId, (matchCard || hand[0]).id);
        return;
      }
    }
    advanceTurn(`🤖 ${cur.name} 턴 패스`);
  }

  function handleWordchainSubmit(playerId, rawWord) {
    const word = (rawWord || '').trim();
    const cur = getCurrentTurnPlayer();
    if (!cur || cur.id !== playerId) return;
    if (word.length < 2) {
      addLog(`❌ ${cur.name}: 두 글자 이상 입력하세요.`);
      return;
    }
    const needStart = state.wordchain.lastWord.slice(-1);
    if (word[0] !== needStart) {
      addLog(`❌ ${cur.name}: '${needStart}'(으)로 시작해야 합니다! (${word})`);
      return;
    }
    if (state.wordchain.used.includes(word)) {
      addLog(`❌ ${cur.name}: 이미 나온 단어입니다! (${word})`);
      return;
    }
    state.wordchain.used.push(word);
    state.wordchain.lastWord = word;
    state.wordchain.combo += 1;
    const pts = 10 + (state.wordchain.combo >= 3 ? 5 : 0);
    state.scores[playerId] = (state.scores[playerId] || 0) + pts;
    addLog(`✅ ${cur.name}: "${word}" (+${pts}점${state.wordchain.combo >= 3 ? ' · 3콤보!' : ''})`);
    advanceTurn();
  }

  function handleHunminSubmit(playerId, rawWord) {
    const word = (rawWord || '').trim();
    const cur = getCurrentTurnPlayer();
    if (!cur || cur.id !== playerId) return;
    if (word.length !== 2) {
      addLog(`❌ ${cur.name}: 정확히 2글자 단어를 입력하세요.`);
      return;
    }
    const cs = getChosung(word);
    if (cs !== state.hunmin.prompt) {
      addLog(`❌ ${cur.name}: 초성 [${state.hunmin.prompt}]과 다릅니다! ("${word}" -> ${cs})`);
      return;
    }
    if (state.hunmin.used.includes(word)) {
      addLog(`❌ ${cur.name}: 이미 사용한 단어입니다!`);
      return;
    }
    state.hunmin.used.push(word);
    state.scores[playerId] = (state.scores[playerId] || 0) + 15;
    addLog(`🎯 ${cur.name}: "${word}" (${state.hunmin.prompt}) 정답! +15점`);
    state.hunmin.prompt = pickRandomItem(HUNMIN_PROMPTS, state.hunmin.prompt);
    advanceTurn();
  }

  function handleNunchiCall(playerId, num) {
    const targetMax = Math.max(2, state.players.length);
    const expected = state.nunchi.currentNum + 1;
    const pname = getPlayerName(playerId);

    if (num !== expected || state.nunchi.calls.some(c => c.num === num)) {
      state.scores[playerId] = (state.scores[playerId] || 0) - 10;
      addLog(`💥 ${pname} 눈치 실패! (${num} 외침 — -10점) 새 판 시작!`);
      state.nunchi = { currentNum: 0, calls: [] };
      syncStateToPeers();
      renderAll();
      return;
    }

    state.nunchi.currentNum = num;
    state.nunchi.calls.push({ playerId, name: pname, num });
    state.scores[playerId] = (state.scores[playerId] || 0) + 10;
    addLog(`👀 ${pname}: "${num}" 성공! (+10점)`);

    if (num >= targetMax) {
      addLog(`🎉 ${targetMax}까지 눈치게임 클리어! 다음 라운드로 넘어갑니다.`);
      state.nunchi = { currentNum: 0, calls: [] };
    }
    syncStateToPeers();
    renderAll();
  }

  function evaluateChatAnswer(senderId, senderName, text) {
    const clean = (text || '').trim();
    if (!clean) return;
    if (state.mode === 'catchmind' && !state.catchmind.guessed && senderId !== state.catchmind.drawerId) {
      if (clean === state.catchmind.prompt.word) {
        state.catchmind.guessed = true;
        state.scores[senderId] = (state.scores[senderId] || 0) + 20;
        state.scores[state.catchmind.drawerId] = (state.scores[state.catchmind.drawerId] || 0) + 10;
        addLog(`🎉 ${senderName} 님 정답! 제시어는 [${state.catchmind.prompt.word}] (+20점 / 출제자 +10점)`);
        setTimeout(() => advanceTurn(), 900);
      }
    } else if (state.mode === 'chosung' && !state.chosung.solved) {
      const item = CHOSUNG_POOL[state.chosung.index];
      if (clean === item.a) {
        state.chosung.solved = true;
        state.scores[senderId] = (state.scores[senderId] || 0) + 15;
        addLog(`⚡ ${senderName} 님 초성 퀴즈 정답! "${item.a}" (+15점)`);
        setTimeout(() => advanceTurn(), 800);
      }
    } else if (state.mode === 'emojiquiz' && !state.emojiquiz.solved) {
      const item = EMOJI_POOL[state.emojiquiz.index];
      if (clean === item.a) {
        state.emojiquiz.solved = true;
        state.scores[senderId] = (state.scores[senderId] || 0) + 15;
        addLog(`😄 ${senderName} 님 이모지 퀴즈 정답! "${item.a}" (+15점)`);
        setTimeout(() => advanceTurn(), 800);
      }
    } else if (state.mode === 'wordassoc' && !state.wordassoc.solved) {
      const item = WORDASSOC_POOL[state.wordassoc.index];
      if (clean === item.a) {
        state.wordassoc.solved = true;
        state.scores[senderId] = (state.scores[senderId] || 0) + 15;
        addLog(`💡 ${senderName} 님 단어 연상 정답! "${item.a}" (+15점)`);
        setTimeout(() => advanceTurn(), 800);
      }
    } else if (state.mode === 'proverb' && !state.proverb.solved) {
      const item = PROVERB_POOL[state.proverb.index];
      if (clean === item.a) {
        state.proverb.solved = true;

        addLog(`📜 ${senderName} 님 속담 완성 정답! "${item.a}" (+15점)`);
        setTimeout(() => advanceTurn(), 800);
      }
    }

  function handleCardFlipSizeChange(playerId, newSize) {
    if (!state.isHost && !state.soloIsland) return;
    const sz = [4, 8, 16].includes(Number(newSize)) ? Number(newSize) : 4;
    state.cardflip = { size: sz, cards: buildCardDeck(sz), flipped: [], matched: [] };
    state.timeLeft = GAME_CONFIG.cardFlipSeconds[sz] || 35;
    addLog(`🃏 ${getPlayerName(playerId)}님이 같은 그림찾기 판 크기를 ${sz}×${sz}(${sz * sz}장)으로 변경했습니다!`);
    syncStateToPeers();
    renderAll();
  }

  function handleCardFlip(playerId, index) {
    const cur = getCurrentTurnPlayer();
    if (!cur || cur.id !== playerId) return;
    const cf = state.cardflip;
    if (cf.matched.includes(index) || cf.flipped.includes(index) || cf.flipped.length >= 2) return;
    cf.flipped.push(index);

    if (cf.flipped.length === 2) {
      const [a, b] = cf.flipped;
      if (cf.cards[a].icon === cf.cards[b].icon) {
        cf.matched.push(a, b);
        cf.flipped = [];
        const bonus = cf.size === 16 ? 20 : cf.size === 8 ? 15 : 10;
        state.scores[playerId] = (state.scores[playerId] || 0) + bonus;
        addLog(`🃏 ${cur.name} 짝 맞추기 성공! (${cf.cards[a].icon} +${bonus}점 · 연속 턴)`);
        if (cf.matched.length === cf.cards.length) {
          addLog(`🏆 ${cf.size}×${cf.size} 보드 올클리어! 새 판을 준비합니다.`);
          state.cardflip = { size: cf.size, cards: buildCardDeck(cf.size), flipped: [], matched: [] };
          advanceTurn();
          return;
        }
        syncStateToPeers();
        renderAll();
      } else {
        addLog(`❌ ${cur.name} 짝 불일치! 다음 턴으로 넘어갑니다.`);
        syncStateToPeers();
        renderAll();
        setTimeout(() => {
          state.cardflip.flipped = [];
          advanceTurn();
        }, 700);
      }
      return;
    }
    syncStateToPeers();
    renderAll();
  }

  function resolveLiarVote() {
    const counts = {};
    Object.values(state.liar.votes).forEach(tid => {
      counts[tid] = (counts[tid] || 0) + 1;
    });
    let topId = null;
    let topVotes = 0;
    Object.entries(counts).forEach(([tid, cnt]) => {
      if (cnt > topVotes) { topVotes = cnt; topId = tid; }
    });
    state.liar.revealed = true;
    const liarName = getPlayerName(state.liar.liarId);
    if (topId === state.liar.liarId) {
      state.players.forEach(p => {
        if (p.id !== state.liar.liarId) state.scores[p.id] = (state.scores[p.id] || 0) + 15;
      });
      addLog(`🎉 라이어 [${liarName}] 검거 성공! 시민들 +15점!`);
    } else {
      state.scores[state.liar.liarId] = (state.scores[state.liar.liarId] || 0) + 25;
      addLog(`😈 라이어 [${liarName}] 검거 실패! 라이어 +25점!`);
    }
    syncStateToPeers();
    renderAll();
  }

  function applyIslandGather(playerId, resource, amount, label) {
    state.island[resource] = (state.island[resource] || 0) + amount;
    state.scores[playerId] = (state.scores[playerId] || 0) + amount * 5;
    addLog(`🏝️ ${getPlayerName(playerId)} ${label} (+${amount})`);
    syncStateToPeers();
    renderAll();
  }

  function applyIslandSell(playerId) {
    const w = state.island.wood || 0;
    const f = state.island.fish || 0;
    const c = state.island.coconut || 0;
    const earned = w * GAME_CONFIG.marketPrices.wood + f * GAME_CONFIG.marketPrices.fish + c * GAME_CONFIG.marketPrices.coconut;
    if (earned <= 0) {
      addLog('🛒 판매할 무인도 자원이 없습니다.');
      return;
    }
    state.island.wood = 0;
    state.island.fish = 0;
    state.island.coconut = 0;
    state.sharedMoney += earned;
    state.scores[playerId] = (state.scores[playerId] || 0) + Math.floor(earned / 50);
    addLog(`💵 ${getPlayerName(playerId)} 자원 판매 완료! +${earned.toLocaleString()}원 (공용 자금 ${state.sharedMoney.toLocaleString()}원)`);
    syncStateToPeers();
    renderAll();
  }

  function openIslandMiniStage(stage) {
    state.island.miniStage = stage;
    if (stage === 'fish') {
      miniLocal.fish = { bite: false, reel: 0, caughtCount: 0, msg: '입질(!)이 오면 마우스/터치를 위로 당기거나 [낚싯대 당기기]를 누르세요!' };
      setTimeout(() => {
        if (state.island.miniStage === 'fish') {
          miniLocal.fish.bite = true;
          miniLocal.fish.msg = '❗ 입질이 왔습니다! 지금 위로 당기세요!';
          updateMiniStageUI();
        }
      }, 1400);
    } else if (stage === 'wood') {
      miniLocal.wood = { pos: 8, dir: 1, choppedCount: 0, critCount: 0, msg: '노란 바가 초록 구역(38~62%)에 있을 때 클릭 또는 Space!' };
    } else if (stage === 'coconut') {
      spawnCoconutSlots();
      miniLocal.coconut.harvestedCount = 0;
      miniLocal.coconut.msg = '잘 익은 코코넛(🥥, 🥥✨)을 따고 벌레 열매(🐛)는 피하세요!';
    }
    renderAll();
  }

  function spawnCoconutSlots() {
    const pool = [
      { kind: 'ripe', icon: '🥥', label: '잘 익음' },
      { kind: 'gold', icon: '🥥✨', label: '황금' },
      { kind: 'bug', icon: '🐛', label: '벌레' }
    ];
    miniLocal.coconut.slots = Array.from({ length: 6 }, () => {
      const r = Math.random();
      if (r < 0.55) return pool[0];
      if (r < 0.78) return pool[1];
      return pool[2];
    });
  }

  function settleAndCloseMiniStage() {
    const st = state.island.miniStage;
    if (st === 'fish' && miniLocal.fish.caughtCount > 0) {
      const cnt = miniLocal.fish.caughtCount;
      if (state.isHost || state.soloIsland) applyIslandGather(state.myId, 'fish', cnt, `물고기 ${cnt}마리 낚기 정산`);
      else broadcast({ type: 'ACTION_ISLAND_GATHER', playerId: state.myId, resource: 'fish', amount: cnt, label: `물고기 ${cnt}마리 낚기 정산` });
    } else if (st === 'wood' && miniLocal.wood.choppedCount > 0) {
      const cnt = miniLocal.wood.choppedCount;
      if (state.isHost || state.soloIsland) applyIslandGather(state.myId, 'wood', cnt, `통나무 ${cnt}개 패기 정산`);
      else broadcast({ type: 'ACTION_ISLAND_GATHER', playerId: state.myId, resource: 'wood', amount: cnt, label: `통나무 ${cnt}개 패기 정산` });
    } else if (st === 'coconut' && miniLocal.coconut.harvestedCount > 0) {
      const cnt = miniLocal.coconut.harvestedCount;
      if (state.isHost || state.soloIsland) applyIslandGather(state.myId, 'coconut', cnt, `코코넛 ${cnt}개 수확 정산`);
      else broadcast({ type: 'ACTION_ISLAND_GATHER', playerId: state.myId, resource: 'coconut', amount: cnt, label: `코코넛 ${cnt}개 수확 정산` });
    }
    state.island.miniStage = null;
    renderAll();
  }

  function initGostopRound() {
    const shuffled = [...HWATU_DECK].sort(() => Math.random() - 0.5);
    const floorCount = Math.min(6, Math.max(2, shuffled.length - state.players.length * 5));
    state.gostop.floor = shuffled.splice(0, floorCount);
    state.gostop.hands = {};
    state.gostop.captured = {};
    state.gostop.shaken = {};
    state.gostop.goCount = 0;

    state.players.forEach((p) => {
      state.gostop.hands[p.id] = shuffled.splice(0, 5);
      state.gostop.captured[p.id] = [];
      state.gostop.shaken[p.id] = false;
    });

    state.gostop.stock = shuffled;

    const cur = getCurrentTurnPlayer();
    state.gostop.turnId = cur ? cur.id : state.myId;
    hoveredHandMonth = null;
  }

  function handleGostopShake(playerId) {
    const hand = state.gostop.hands[playerId] || [];
    const monthCounts = {};
    hand.forEach(c => { monthCounts[c.month] = (monthCounts[c.month] || 0) + 1; });
    const hasTriple = Object.values(monthCounts).some(cnt => cnt >= 3);
    if (!hasTriple) {
      addLog(`🌪️ ${getPlayerName(playerId)} 흔들기 시도 실패 (동일 월 3장 필요)`);
      return;
    }
    state.gostop.shaken[playerId] = true;
    addLog(`🌪️💥 ${getPlayerName(playerId)} 흔들기 선언! 배수 2배 적용!`);
    syncStateToPeers();
    renderAll();
  }

  function handleGostopPlay(playerId, cardId) {
    if (state.gostop.turnId !== playerId) {
      addLog(`⏳ 아직 ${getPlayerName(playerId)} 차례가 아닙니다.`);
      return;
    }
    const hand = state.gostop.hands[playerId] || [];
    const idx = hand.findIndex(c => c.id === cardId);
    if (idx === -1) return;
    const [playedCard] = hand.splice(idx, 1);

    const floorMatchIdx = state.gostop.floor.findIndex(f => f.month === playedCard.month);
    if (floorMatchIdx !== -1) {
      const [takenFloorCard] = state.gostop.floor.splice(floorMatchIdx, 1);
      state.gostop.captured[playerId].push(playedCard, takenFloorCard);
      addLog(`✨ ${getPlayerName(playerId)} 손패 [${playedCard.id}] ↔ 바닥 [${takenFloorCard.id}] 먹기!`);
    } else {
      state.gostop.floor.push(playedCard);
      addLog(`🃏 ${getPlayerName(playerId)} 손패 [${playedCard.id}] 바닥에 내려놓음`);
    }

    if (state.gostop.stock && state.gostop.stock.length > 0) {
      const drawnCard = state.gostop.stock.pop();
      const drawMatchIdx = state.gostop.floor.findIndex(f => f.month === drawnCard.month);
      if (drawMatchIdx !== -1) {
        const [takenDrawFloor] = state.gostop.floor.splice(drawMatchIdx, 1);
        state.gostop.captured[playerId].push(drawnCard, takenDrawFloor);
        addLog(`🎴 더미 뒤집기 [${drawnCard.id}] ↔ 바닥 [${takenDrawFloor.id}] 추가 먹기!`);
      } else {
        state.gostop.floor.push(drawnCard);
        addLog(`🎴 더미 뒤집기 [${drawnCard.id}] 바닥에 깔림`);
      }
    }

    hoveredHandMonth = null;

    const cap = state.gostop.captured[playerId];
    const gwangCnt = cap.filter(c => c.type === '광').length;
    if (gwangCnt >= 3 || cap.length >= 6) {
      const mult = (state.gostop.shaken[playerId] ? 2 : 1) * Math.pow(2, state.gostop.goCount);
      const payout = state.gostop.stake * mult;
      state.scores[playerId] = (state.scores[playerId] || 0) + Math.floor(payout / 100);
      state.sharedMoney += Math.floor(payout * 0.25);
      addLog(`🏆 ${getPlayerName(playerId)} 판 승리! (${mult}배 · ${payout.toLocaleString()}원 환산)`);
      initGostopRound();
    }
    advanceTurn();
  }

  function handleGostopGoStop(playerId, choice) {
    if (choice === 'GO') {
      state.gostop.goCount += 1;
      addLog(`🔥 ${getPlayerName(playerId)} GO 선언! (${state.gostop.goCount}고 · 배수 x${Math.pow(2, state.gostop.goCount)})`);
    } else {
      const mult = (state.gostop.shaken[playerId] ? 2 : 1) * Math.pow(2, state.gostop.goCount);
      const winAmt = state.gostop.stake * mult;
      state.scores[playerId] = (state.scores[playerId] || 0) + Math.floor(winAmt / 100);
      addLog(`🛑 ${getPlayerName(playerId)} STOP 선언! ${winAmt.toLocaleString()}원 상당 정산 후 새 판 시작!`);
      initGostopRound();
    }
    syncStateToPeers();
    renderAll();
  }

  function renderModeGrid() {
    const grid = $('modeGrid');
    const canPick = state.isHost && !state.soloIsland;
    $('hostLockNote').textContent = state.soloIsland
      ? '(솔로 무인도 모드)'
      : state.isHost
      ? '(방장 권한: 모드 선택 가능)'
      : '(방장만 모드와 시작을 변경할 수 있습니다)';

    $('btnStartGame').disabled = !state.isHost && !state.soloIsland;

    grid.innerHTML = MODES.map(m => {
      const active = state.mode === m.id ? 'active' : '';
      const dis = !canPick ? 'disabled' : '';
      return `<button class="mode-btn ${active}" data-mode="${m.id}" ${dis}>
        <span>${m.name}</span>
        <small>${m.desc}</small>
      </button>`;
    }).join('');

    grid.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!state.isHost) return;
        state.mode = btn.dataset.mode;
        initModeState(state.mode);
        state.timeLeft = getTurnSecondsForCurrentState();
        addLog(`🎛️ 방장이 [${MODES.find(x => x.id === state.mode)?.name}] 모드를 선택했습니다.`);
        syncStateToPeers();
        renderAll();
      });
    });
  }

  function renderPlayers() {
    const cur = getCurrentTurnPlayer();
    $('playersBar').innerHTML = state.players.map(p => {
      const isTurn = cur && cur.id === p.id && state.activeGame;
      return `<div class="player-chip ${isTurn ? 'turn' : ''}">
        <span>${p.isBot ? '🤖' : '👤'} <strong>${p.name}</strong></span>
        ${p.id === state.myId ? '<span style="color:#38bdf8; font-size:0.75rem;">(나)</span>' : ''}
        ${isTurn ? '<span style="color:#facc15; font-size:0.75rem;">● 내 차례</span>' : ''}
      </div>`;
    }).join('');
    $('sharedMoneyLabel').textContent = state.sharedMoney.toLocaleString() + '원';
  }

  function renderLogs() {
    $('logBox').innerHTML = state.logs.map(l =>
      `<div class="log-line"><span class="time">[${l.t}]</span>${l.text}</div>`
    ).join('');
    $('logBox').scrollTop = $('logBox').scrollHeight;

    const sorted = [...state.players].sort((a, b) => (state.scores[b.id] || 0) - (state.scores[a.id] || 0));
    $('scoreList').innerHTML = sorted.map((p, idx) =>
      `<div class="log-line"><strong>${idx + 1}위</strong> ${p.name} — <span style="color:#7dd3fc; font-weight:700;">${state.scores[p.id] || 0}점</span></div>`
    ).join('');
  }

  function renderLiarCircleArena(myVoteTarget) {
    const list = state.players.length ? state.players : [{ id: state.myId, name: state.myName, isBot: false }];
    const count = list.length;
    const rx = count <= 2 ? 155 : 192;
    const ry = count <= 2 ? 95 : 122;
    const curSpeaker = getCurrentTurnPlayer();
    const voteCounts = {};
    Object.values(state.liar.votes || {}).forEach(tid => {
      voteCounts[tid] = (voteCounts[tid] || 0) + 1;
    });

    const seatsHtml = list.map((p, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI * i) / count;
      const leftPct = 50 + (rx / 280) * 50 * Math.cos(angle);
      const topPct = 50 + (ry / 180) * 50 * Math.sin(angle);
      const isSpeaking = curSpeaker && curSpeaker.id === p.id && !state.liar.revealed;
      const isSelected = myVoteTarget === p.id;
      const hintText = state.liar.hints[p.id];
      const vCnt = voteCounts[p.id] || 0;
      const isActualLiar = state.liar.revealed && state.liar.liarId === p.id;

      return `
        <div class="liar-seat ${isSpeaking ? 'speaking' : ''} votable ${isSelected ? 'selected-vote' : ''}"
             data-vote-id="${p.id}"
             style="left:${leftPct.toFixed(1)}%; top:${topPct.toFixed(1)}%;">
          <div class="liar-chair-icon">${isActualLiar ? '😈🪑' : isSpeaking ? '🎤🪑' : '🪑'}</div>
          <div class="liar-seat-name">${p.name}${p.id === state.myId ? ' (나)' : ''}</div>
          ${hintText ? `<div class="liar-speech-bubble">"${hintText}"</div>` : `<div style="font-size:0.7rem; color:var(--muted); margin-top:2px;">${isSpeaking ? '말하는 중...' : '대기'}</div>`}
          ${vCnt > 0 ? `<div style="font-size:0.7rem; color:#fb923c; font-weight:700; margin-top:2px;">🗳️ ${vCnt}표</div>` : ''}
        </div>
      `;
    }).join('');

    return `
      <div class="liar-arena">
        <div class="liar-center-table">
          <small>라운드 테이블</small>
          <strong>[${state.liar.topic.cat}]</strong>
          <small style="margin-top:4px; color:#fde047;">${curSpeaker && !state.liar.revealed ? curSpeaker.name + ' 발언 차례' : '투표/결과'}</small>
        </div>
        ${seatsHtml}
      </div>
    `;
  }

  function renderGameViewport() {
    const vp = $('gameViewport');
    const cur = getCurrentTurnPlayer();
    const myTurn = isMyTurn();
    const urgent = state.timeLeft <= 5 ? 'urgent' : '';

    const hudHtml = `
      <div class="hud-strip">
        <div>
          <strong>${MODES.find(m => m.id === state.mode)?.name || state.mode}</strong>
          <span style="margin-left:10px; color:#facc15;">
            현재 턴: <strong>${cur ? cur.name : '-'}</strong> ${myTurn ? '(내 차례!)' : ''}
          </span>
        </div>
        <div class="row">
          <span class="timer-pill ${urgent}">⏱ ${state.timeLeft}초</span>
          ${state.isHost ? `<button id="btnNextTurn" class="btn-ghost" style="padding:5px 10px; font-size:0.8rem;">턴 넘기기</button>` : ''}
        </div>
      </div>
    `;

    if (state.mode === 'wordchain') {
      vp.innerHTML = hudHtml + `
        <p style="margin:6px 0;">마지막 단어: <strong style="font-size:1.25rem; color:#38bdf8;">${state.wordchain.lastWord}</strong>
        (다음 글자: <strong style="color:#4ade80;">'${state.wordchain.lastWord.slice(-1)}'</strong> · 연속 콤보: ${state.wordchain.combo})</p>
        <div class="row">
          <input id="wcInput" type="text" placeholder="이어갈 단어 입력..." ${myTurn ? '' : 'disabled'} />
          <button id="wcSubmit" class="btn-primary" ${myTurn ? '' : 'disabled'}>제출</button>
        </div>
        <p style="font-size:0.8rem; color:var(--muted); margin-top:8px;">사용된 단어: ${state.wordchain.used.join(', ') || '-'}</p>
      `;
      $('wcSubmit')?.addEventListener('click', () => {
        const val = $('wcInput').value;
        $('wcInput').value = '';
        if (state.isHost) handleWordchainSubmit(state.myId, val);
        else broadcast({ type: 'ACTION_WORDCHAIN', playerId: state.myId, word: val });
      });
      if (myTurn) setTimeout(() => $('wcInput')?.focus(), 30);
    } else if (state.mode === 'hunmin') {
      vp.innerHTML = hudHtml + `
        <p style="margin:6px 0;">랜덤 출제 초성 (${HUNMIN_PROMPTS.length}종 풀): <strong style="font-size:1.5rem; color:#facc15; letter-spacing:4px;">${state.hunmin.prompt}</strong></p>
        <div class="row">
          <input id="hmInput" type="text" maxlength="2" placeholder="초성에 맞는 2글자 입력" ${myTurn ? '' : 'disabled'} />
          <button id="hmSubmit" class="btn-green" ${myTurn ? '' : 'disabled'}>정답 제출</button>
        </div>
        <p style="font-size:0.8rem; color:var(--muted); margin-top:8px;">정답 목록: ${state.hunmin.used.join(', ') || '아직 없음'}</p>
      `;
      $('hmSubmit')?.addEventListener('click', () => {
        const val = $('hmInput').value;
        $('hmInput').value = '';
        if (state.isHost) handleHunminSubmit(state.myId, val);
        else broadcast({ type: 'ACTION_HUNMIN', playerId: state.myId, word: val });
      });
      if (myTurn) setTimeout(() => {
        const el = $('hmInput');
        if (el && !el.disabled) el.focus();
      }, 30);
    } else if (state.mode === 'nunchi') {
      const maxNum = Math.max(2, state.players.length);
      const nextNum = state.nunchi.currentNum + 1;
      vp.innerHTML = hudHtml + `
        <p style="margin:6px 0;">목표 숫자: <strong>1 ~ ${maxNum}</strong> · 현재 숫자: <strong style="color:#38bdf8; font-size:1.2rem;">${state.nunchi.currentNum}</strong> (숫자가 겹치면 -10점!)</p>
        <div class="row" style="margin:10px 0;">
          <button id="btnNunchiNext" class="btn-amber">👀 다음 숫자 "${nextNum}" 외치기!</button>
        </div>
        <div class="nunchi-board">
          ${state.nunchi.calls.map(c => `<div class="nunchi-badge">${c.num} · ${c.name}</div>`).join('') || '<span style="color:var(--muted); font-size:0.84rem;">아직 외친 숫자가 없습니다.</span>'}
        </div>
      `;
      $('btnNunchiNext')?.addEventListener('click', () => {
        if (state.isHost || state.soloIsland) handleNunchiCall(state.myId, nextNum);
        else broadcast({ type: 'ACTION_NUNCHI', playerId: state.myId, num: nextNum });
      });
    } else if (state.mode === 'wordassoc') {
      const item = WORDASSOC_POOL[state.wordassoc.index] || WORDASSOC_POOL[0];
      vp.innerHTML = hudHtml + `
        <div style="font-size:0.8rem; color:var(--muted); margin-bottom:4px;">랜덤 연상 문제 풀: ${WORDASSOC_POOL.length}개</div>
        <p style="margin:6px 0;">연상 단서: ${item.clues.map(cl => `<span class="nunchi-badge" style="padding:4px 10px;">#${cl}</span>`).join(' ')}</p>
        <p style="margin:8px 0 0; color:#fde047;"><strong>아래 채팅창에 연상되는 정답을 입력하세요!</strong></p>
      `;
    } else if (state.mode === 'proverb') {
      const item = PROVERB_POOL[state.proverb.index] || PROVERB_POOL[0];
      vp.innerHTML = hudHtml + `
        <div style="font-size:0.8rem; color:var(--muted); margin-bottom:4px;">랜덤 속담 문제 풀: ${PROVERB_POOL.length}개</div>
        <div style="font-size:1.25rem; font-weight:700; color:#7dd3fc; margin:8px 0;">"${item.prompt}"</div>
        <p style="margin:4px 0 0; color:#fde047;"><strong>빈칸/뒷부분 정답을 채팅창에 입력하세요!</strong></p>
      `;
    } else if (state.mode === 'catchmind') {
      const isDrawer = state.catchmind.drawerId === state.myId;
      const colors = ['#0f172a','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899','#92400e'];
      vp.innerHTML = hudHtml + `
        <div style="margin-bottom:8px;">
          출제자: <strong>${getPlayerName(state.catchmind.drawerId)}</strong> (${CATCHMIND_PROMPTS.length}종 제시어 풀) ·
          ${isDrawer
            ? `내 제시어: <strong style="color:#4ade80; font-size:1.15rem;">[${state.catchmind.prompt.cat}] ${state.catchmind.prompt.word}</strong>`
            : `카테고리 힌트: <strong style="color:#facc15;">[${state.catchmind.prompt.cat}]</strong> (${state.catchmind.prompt.word.length}글자 — 채팅창에 정답 입력!)`}
        </div>
        ${isDrawer ? `
          <div class="palette-row">
            ${colors.map(c => `<button class="swatch ${!brush.eraser && brush.color === c ? 'selected' : ''}" data-color="${c}" style="background:${c};" title="${c}"></button>`).join('')}
            <select id="brushSize">
              <option value="2" ${brush.size === 2 ? 'selected' : ''}>가는 선</option>
              <option value="4" ${brush.size === 4 ? 'selected' : ''}>중간 선</option>
              <option value="9" ${brush.size === 9 ? 'selected' : ''}>굵은 선</option>
            </select>
            <button id="btnEraser" class="btn-ghost ${brush.eraser ? 'btn-amber' : ''}" style="padding:6px 10px; font-size:0.82rem;">🧽 지우개</button>
            <button id="btnClearCanvas" class="btn-danger" style="padding:6px 10px; font-size:0.82rem;">🗑️ 전체 지우기</button>
          </div>
        ` : ''}
        <canvas id="catchCanvas" class="draw-canvas" width="640" height="310"></canvas>
      `;
      bindCatchmindEvents(isDrawer);
      redrawCatchmindCanvas();
    } else if (state.mode === 'cardflip') {
      const cf = state.cardflip;
      const sz = cf.size || 4;
      const canChangeSize = state.isHost || state.soloIsland;
      vp.innerHTML = hudHtml + `
        <div class="row" style="justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:0.88rem; color:var(--muted);">
            판 크기: <strong style="color:#38bdf8;">${sz}×${sz}</strong> (${cf.cards.length}장) ·
            맞춘 짝: <strong>${cf.matched.length / 2}</strong> / ${cf.cards.length / 2}
          </span>
          <div class="row">
            ${[4, 8, 16].map(n => `
              <button class="btn-size-pick ${sz === n ? 'btn-primary' : 'btn-ghost'}" data-sz="${n}" style="padding:5px 10px; font-size:0.8rem;" ${!canChangeSize ? 'disabled' : ''}>${n}×${n}</button>
            `).join('')}
          </div>
        </div>
        <div class="card-flip-board size-${sz}">
          ${cf.cards.map((c, idx) => {
            const isMatched = cf.matched.includes(idx);
            const open = cf.flipped.includes(idx) || isMatched;
            return `<button class="flip-btn ${open ? 'revealed' : ''} ${isMatched ? 'matched' : ''}" data-idx="${idx}" ${!myTurn || open ? 'disabled' : ''}>${open ? c.icon : '❓'}</button>`;
          }).join('')}
        </div>
      `;
      vp.querySelectorAll('.btn-size-pick').forEach(btn => {
        btn.addEventListener('click', () => {
          const nextSize = Number(btn.dataset.sz);
          if (state.isHost || state.soloIsland) handleCardFlipSizeChange(state.myId, nextSize);
          else broadcast({ type: 'ACTION_CARDFLIP_SIZE', playerId: state.myId, size: nextSize });
        });
      });
      vp.querySelectorAll('.flip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = Number(btn.dataset.idx);
          if (state.isHost) handleCardFlip(state.myId, i);
          else broadcast({ type: 'ACTION_CARDFLIP', playerId: state.myId, index: i });
        });
      });
    } else if (state.mode === 'emojiquiz') {
      const item = EMOJI_POOL[state.emojiquiz.index] || EMOJI_POOL[0];
      vp.innerHTML = hudHtml + `
        <div style="font-size:0.8rem; color:var(--muted);">랜덤 이모지 문제 풀: ${EMOJI_POOL.length}개</div>
        <div style="font-size:2.2rem; margin:8px 0;">${item.e}</div>
        <p style="margin:4px 0 10px; color:#fde047;">힌트: ${item.hint} · <strong>아래 채팅창에 정답을 입력하세요!</strong></p>
      `;
    } else if (state.mode === 'chosung') {
      const item = CHOSUNG_POOL[state.chosung.index] || CHOSUNG_POOL[0];
      vp.innerHTML = hudHtml + `
        <div style="font-size:0.8rem; color:var(--muted);">랜덤 초성 문제 풀: ${CHOSUNG_POOL.length}개</div>
        <div style="font-size:2rem; letter-spacing:6px; font-weight:800; color:#38bdf8; margin:8px 0;">${item.q}</div>
        <p style="margin:4px 0 10px; color:#fde047;">힌트: ${item.hint} · <strong>아래 채팅창에 정답을 입력하세요!</strong></p>
      `;
    } else if (state.mode === 'liar') {
      const isLiar = state.liar.liarId === state.myId;
      let selectedVote = state.liar.votes[state.myId] || (state.players[0] && state.players[0].id) || '';

      vp.innerHTML = hudHtml + `
        <div style="margin-bottom:8px;">
          주제 카테고리: <strong>[${state.liar.topic.cat}]</strong> (${LIAR_TOPICS.length}종 주제 풀) ·
          ${isLiar
            ? `<span style="color:#f87171; font-weight:700;">당신은 라이어입니다! 들키지 않게 둘러대세요.</span>`
            : `제시어: <strong style="color:#4ade80; font-size:1.15rem;">${state.liar.topic.word}</strong>`}
        </div>
        ${renderLiarCircleArena(selectedVote)}
        <div class="row" style="margin-bottom:10px;">
          <input id="liarHintInput" type="text" placeholder="내 차례 힌트 한마디 입력..." ${myTurn ? '' : 'disabled'} style="flex:1; min-width:180px;" />
          <button id="btnLiarHint" class="btn-primary" ${myTurn ? '' : 'disabled'}>🎤 힌트 말하기</button>
        </div>
        <div class="row">
          <span style="font-size:0.84rem; color:var(--muted);">좌석 클릭 또는 선택 후 투표:</span>
          <select id="liarVoteSelect">
            ${state.players.map(p => `<option value="${p.id}" ${p.id === selectedVote ? 'selected' : ''}>${p.name} 지목</option>`).join('')}
          </select>
          <button id="btnLiarVote" class="btn-amber">🗳️ 라이어 투표</button>
        </div>
      `;

      vp.querySelectorAll('.liar-seat').forEach(seat => {
        seat.addEventListener('click', () => {
          selectedVote = seat.dataset.voteId;
          const sel = $('liarVoteSelect');
          if (sel) sel.value = selectedVote;
          vp.querySelectorAll('.liar-seat').forEach(s => s.classList.toggle('selected-vote', s.dataset.voteId === selectedVote));
        });
      });

      $('btnLiarHint')?.addEventListener('click', () => {
        const h = $('liarHintInput').value.trim();
        if (!h) return;
        $('liarHintInput').value = '';
        if (state.isHost) {
          state.liar.hints[state.myId] = h;
          addLog(`🕵️ ${state.myName} 힌트: "${h}"`);
          advanceTurn();
        } else {
          broadcast({ type: 'ACTION_LIAR_HINT', playerId: state.myId, hint: h });
        }
      });
      if (myTurn) setTimeout(() => $('liarHintInput')?.focus(), 30);

      $('btnLiarVote')?.addEventListener('click', () => {
        const targetId = $('liarVoteSelect').value;
        if (state.isHost) {
          state.liar.votes[state.myId] = targetId;
          if (Object.keys(state.liar.votes).length >= state.players.length) resolveLiarVote();
          else { syncStateToPeers(); renderAll(); }
        } else {
          broadcast({ type: 'ACTION_LIAR_VOTE', playerId: state.myId, targetId });
        }
      });
    } else if (state.mode === 'island') {
      const isl = state.island;
      const expectedGain =
        (isl.wood || 0) * GAME_CONFIG.marketPrices.wood +
        (isl.fish || 0) * GAME_CONFIG.marketPrices.fish +
        (isl.coconut || 0) * GAME_CONFIG.marketPrices.coconut;

      vp.innerHTML = hudHtml + `
        <div style="margin-bottom:8px; font-size:0.9rem;">오늘의 날씨/이벤트: <strong style="color:#fde047;">${isl.weather}</strong></div>
        <div class="island-stats">
          <div class="stat-box">🪵 통나무 (개당 ${GAME_CONFIG.marketPrices.wood}원)<strong>${isl.wood}</strong></div>
          <div class="stat-box">🐟 물고기 (마리당 ${GAME_CONFIG.marketPrices.fish}원)<strong>${isl.fish}</strong></div>
          <div class="stat-box">🥥 코코넛 (개당 ${GAME_CONFIG.marketPrices.coconut}원)<strong>${isl.coconut}</strong></div>
          <div class="stat-box">💰 공용 자금<strong>${state.sharedMoney.toLocaleString()}원</strong></div>
        </div>
        <div class="row">
          <button id="btnStageFish" class="btn-primary">🎣 물고기 잡기 스테이지</button>
          <button id="btnStageWood" class="btn-amber">🪓 나무 패기 스테이지</button>
          <button id="btnStageCoconut" class="btn-green">🌴 코코넛 열매 따기 스테이지</button>
          <button id="btnSellIsland" class="btn-purple">💵 자원 전량 판매 (+${expectedGain.toLocaleString()}원)</button>
          <button id="btnGoGostop" class="btn-danger">🎰 고스톱 판으로 출정!</button>
        </div>
        <div id="miniStageContainer"></div>

  function bindCatchmindEvents(isDrawer) {
    const canvas = $('catchCanvas');
    if (!canvas) return;

    document.querySelectorAll('.swatch').forEach(btn => {
      btn.onclick = () => {
        brush.eraser = false;
        brush.color = btn.dataset.color;
        renderGameViewport();
      };
    });
    $('brushSize')?.addEventListener('change', (e) => {
      brush.size = Number(e.target.value);
    });
    $('btnEraser')?.addEventListener('click', () => {
      brush.eraser = !brush.eraser;
      renderGameViewport();
    });
    $('btnClearCanvas')?.addEventListener('click', () => {
      state.catchmind.strokes = [];
      redrawCatchmindCanvas();
      broadcast({ type: 'CLEAR_CANVAS' });
    });

    if (!isDrawer) return;

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = canvas.width / rect.width;
      const sy = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * sx,
        y: (e.clientY - rect.top) * sy
      };
    };

    canvas.onpointerdown = (e) => {
      brush.drawing = true;
      const pt = getPos(e);
      brush.currentStroke = {
        color: brush.eraser ? '#ffffff' : brush.color,
        width: brush.eraser ? brush.size * 2.5 : brush.size,
        points: [pt]
      };
    };

    canvas.onpointermove = (e) => {
      if (!brush.drawing || !brush.currentStroke) return;
      const pt = getPos(e);
      const prev = brush.currentStroke.points[brush.currentStroke.points.length - 1];
      brush.currentStroke.points.push(pt);
      drawSegment(canvas.getContext('2d'), prev, pt, brush.currentStroke.color, brush.currentStroke.width);
    };

    const finishStroke = () => {
      if (!brush.drawing || !brush.currentStroke) return;
      brush.drawing = false;
      const st = brush.currentStroke;
      brush.currentStroke = null;
      if (st.points.length > 0) {
        state.catchmind.strokes.push(st);
        broadcast({ type: 'DRAW_STROKE', stroke: st });
      }
    };

    canvas.onpointerup = finishStroke;
    canvas.onpointerleave = finishStroke;
  }

  function drawSegment(ctx, a, b, color, width) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.restore();
  }

  function appendStrokeToCanvas(stroke) {
    const canvas = $('catchCanvas');
    if (!canvas || !stroke || !stroke.points?.length) return;
    const ctx = canvas.getContext('2d');
    if (stroke.points.length === 1) {
      const p = stroke.points[0];
      drawSegment(ctx, p, { x: p.x + 0.5, y: p.y + 0.5 }, stroke.color, stroke.width);
      return;
    }
    for (let i = 1; i < stroke.points.length; i++) {
      drawSegment(ctx, stroke.points[i - 1], stroke.points[i], stroke.color, stroke.width);
    }
  }

  function redrawCatchmindCanvas() {
    const canvas = $('catchCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    state.catchmind.strokes.forEach(appendStrokeToCanvas);
  }

        <strong style="color:#4ade80;">${state.scores[p.id] || 0}점</strong>
      </div>`
    ).join('') || '<p>참여자가 없습니다.</p>';
    $('rankingModal').classList.add('open');
  });
  $('btnCloseRanking').addEventListener('click', () => $('rankingModal').classList.remove('open'));

  ensurePlayer(state.myId, state.myName, false);
  renderAll();
})();
</script>
</body>
</html>
